    h('p', {html: `It opens when you clear <b>${L.name}</b> in <b>${L.modName}</b>.`}),
    h('div', {class: 'seal-btns'},
      h('button', {class: 'btn acc', on: {click: () => goLesson(L)}}, '▶ Take the chapter'),

    h('button', {class: 'seal-open', on: {click: () => setMode('book')}}, 'Or switch to Book mode — everything open, no game')));

}

/* ---------------- the Index as a collection: a term is "found" when you clear its chapter, visit its page, or open it
   from inside the book. Undiscovered terms still open — they just aren't counted yet. */
const seenTerms = () => store.get('idx.seen', {});
function markSeen(id) { const s = seenTerms(); if (!s[id]) { s[id] = 1; store.set('idx.seen', s); } }
const seenPages = () => store.get('seen.pages', {});
function discovered(id) {
  if (bookMode() || seenTerms()[id]) return true;
  const g = CONCEPT_GOTO[id]; if (!g) return false;
  if (g[0] === 'lesson') return !!courseGot()[g[1]];
  if (g[0] === 'page') return !!seenPages()[g[1]];
  return false;
}
function whereFound(id) {
  const g = CONCEPT_GOTO[id]; if (!g) return 'tap it anywhere in the book';
  if (g[0] === 'lesson') { const L = LESSONS.find(l => l.topic === g[1]); return L ? `clear “${L.name}”` : 'keep learning'; }
  if (g[0] === 'page') { const P = PAGES.find(p => p.id === g[1]); return P ? `visit ${P.name}` : 'keep exploring'; }
  return 'keep learning';
}

/* ---------------- backing up progress: every mm.* key, as a file to save or a code to copy */

  if (!obj || obj.book !== BOOK_ID || typeof obj.keys !== 'object') throw new Error('not a Mandolin Mastery backup');
  Object.keys(localStorage).filter(k => k.startsWith('mm.')).forEach(k => localStorage.removeItem(k));

/* ================================================================ READING MUSIC — the tab-to-staff lessons and the staff games, carried over from
   the guitar book for four courses. A reading chapter ({reading: [lesson ids]} in MODULES) owns a few computed lessons
   (D.staff, from export_mandolin.py): Learn shows one with layers you can switch on under the tab; the three games draw
   only on the notes those lessons use. The course rule is the same as every other chapter: 8 right out of a rolling 10
   in Staff → fret or Fret → staff clears it on the road. */
const STAFF_LAYERS = [['tab', 'Tab'], ['rhythm', 'Rhythm'], ['names', 'Note names'], ['staff', 'The staff'], ['bars', 'Bars & time'], ['key', 'Key signature']];
const REST = {w: '𝄻', 'h.': '𝄼', h: '𝄼', 'q.': '𝄽', q: '𝄽', 'e.': '𝄾', e: '𝄾', s: '𝄿'};
const DOTTED = d => d.endsWith('.');
function tabStaffSVG(L, {lay, lit = -1} = {}) {
  const SLG = 12, dyT = 20, dx = 58, GAP = 14, clefX = 20, sTop = 34, rPad = 18;
  const ksig = (lay.staff && lay.key) ? (L.keysig || []) : [];
  const timeX = clefX + 34 + ksig.length * 11;
  const Lx = Math.max(88, timeX + 18);
  const N = L.notes, nb = L.nbars, W = Lx + N.length * dx + (nb - 1) * GAP + rPad;
  const tabTop = 150, tabBot = tabTop + 3 * dyT;
  let yb = tabBot + 4, namesY = 0, rhyBase = 0, countY = 0;
  if (lay.names) { yb += 17; namesY = yb; }
  if (lay.rhythm) { yb += 28; rhyBase = yb; }
  if (lay.bars) { yb += 20; countY = yb; }
  const H = yb + 12;
  const x0 = 14, x1 = W - 8;
  const colX = n => Lx + (n.col + .5) * dx + n.bar * GAP;
  const noteY = step => sTop + (8 - step) * (SLG / 2);                          // step 0 = the bottom line (E4)
  const tabY = c => tabTop + (3 - c) * dyT;                                     // the E course on top
  const headX = 6.2, up = st => st < 4;
  const o = [`<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" xmlns="${NS}" role="img" aria-label="${L.title} as tab and staff">`];
  if (lit >= 0) { const n = N[lit], x = colX(n); o.push(`<rect x="${x - 15}" y="${sTop - 14}" width="30" height="${(lay.staff ? (H - 24) : (tabBot + 14 - sTop))}" rx="7" fill="var(--gold)" fill-opacity=".22"/>`); }

    if (n.rest) { o.push(`<text x="${x}" y="${top + 2 * SLG + 6}" font-size="18" text-anchor="middle" fill="var(--ink)">𝄽</text>`); return; }
    const y = nY(n.step);

    for (let s = 10; s <= n.step; s += 2) o.push(`<line x1="${x - 10}" x2="${x + 10}" y1="${nY(s)}" y2="${nY(s)}" stroke="var(--ink2)" stroke-width="1.1"/>`);

/* ---------------------------------------------------------------- the tuner: four course lights and the needle; the cover carries a compact one */
function tunerKit(compact) {
  const noteEl = h('b', {style: `font-family:var(--display);font-size:${compact ? 26 : 44}px;line-height:1;min-width:2.2ch;text-align:center`}, '–');
  const dot = h('span', {style: 'width:11px;height:11px;border-radius:50%;background:var(--rule);flex:none'});
  const stat = h('span', {class: 'muted', style: 'font-size:12px;font-weight:700;min-width:9ch;text-align:left'}, '');
  const needle = compact ? null : h('div', {html: needleSVG(null)});
  const lights = h('div', {class: 'tlights'}, COURSES.map((n, c) => h('button', {on: {click: () => hearNote(OPENM[c], .5)}}, h('b', {}, n), h('i', {}, D.openNames[c]))));
  const setLight = (c, ok) => [...lights.children].forEach((b, i) => { b.classList.toggle('on', i === c); b.classList.toggle('ok', i === c && ok); });
  const mic = h('button', {class: 'btn small', on: {click: async () => {
    if (tunerStop) { tunerStop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
      const ctx = audio(), src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 4096; src.connect(an);
      const buf = new Float32Array(an.fftSize); let raf = 0, last = [];
      const loop = () => { an.getFloatTimeDomainData(buf); const f = autoCorrelate(buf, ctx.sampleRate);
        if (f > 70 && f < 1400) { last.push(f); if (last.length > 5) last.shift(); const fm = [...last].sort((a, b) => a - b)[Math.floor(last.length / 2)];
          const m = 69 + 12 * Math.log2(fm / 440), nn = Math.round(m), c = Math.round((m - nn) * 100), ok = Math.abs(c) <= 5;
          const near = OPENM.map((o, i) => [Math.abs(m - o), i]).sort((a, b) => a[0] - b[0])[0], cs = near[0] < 2.5 ? near[1] : -1;
          noteEl.textContent = midiName(nn); dot.style.background = ok ? 'var(--ok)' : 'var(--rust)';
          stat.textContent = `${c > 0 ? '+' : ''}${c}¢ · ${ok ? 'in tune' : c < 0 ? 'tune up' : 'tune down'}${cs >= 0 ? ` · the ${COURSES[cs]} course` : ''}`;
          if (needle) needle.innerHTML = needleSVG(c); setLight(cs, ok && cs >= 0 && nn === OPENM[cs]); }
        raf = requestAnimationFrame(loop); };
      loop(); mic.textContent = 'Stop';
      tunerStop = () => { cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); src.disconnect(); tunerStop = null; mic.textContent = 'Mic'; noteEl.textContent = '–'; dot.style.background = 'var(--rule)'; stat.textContent = ''; if (needle) needle.innerHTML = needleSVG(null); setLight(-1, false); };
    } catch (e) { stat.textContent = 'no mic'; }
  }}}, 'Mic');
  if (compact) return h('div', {style: 'display:flex;flex-direction:column;align-items:flex-end;gap:6px'},
    h('div', {class: 'row', style: 'gap:9px;align-items:center;justify-content:flex-end'}, dot, noteEl, stat, mic), lights);
  return h('div', {style: 'display:flex;flex-direction:column;gap:8px;align-items:center'}, h('div', {class: 'row', style: 'gap:12px;align-items:center;justify-content:center'}, dot, noteEl, stat), needle, lights, h('div', {class: 'row', style: 'justify-content:center'}, mic));
}

/* ================================================================ SKETCHPAD (page VI): the Song Compass for the mandolin
   Your song on the left (sections of chord bars), the compass on the right with the microphone under it.
   Tap a chord on the wheel to put it in the song; or Listen and play: the page hears chords (or single notes),
   names the key they fit, and marks where to go next. The thinking lives in pwa/src/compass/ (PitchEngine,
   ChordFinder, KeyFinder, Suggest: copies of the guitar book's, whose Node tests cover them; spliced in after
   this file by build_book.py). The song is the guitar book's format (store 'song': sections of

const BOOK = {qualIv: D.qualIv, progs: D.progs, strums: [], finger: [], gallery: []};   // the slice of the data Suggest reads
const SECCOL = {Verse: 'var(--navy)', Chorus: 'var(--gold)', Bridge: 'var(--rust)'};
const defaultSong = () => ({name: 'Untitled song', key: 7, minor: false, bpm: 110, pick: 'boomchop', sections: {Verse: [], Chorus: [], Bridge: []}, form: [], active: 'Verse', lyrics: ''});

const DIATONIC = {major: ['', 'm', 'm', '', '', 'm', '°'], minor: ['m', '°', '', 'm', 'm', '', '']};

// a fresh progression for a section, from the library, in the song's mode
function roll(minor) { const pool = D.progs.filter(p => p.minor === minor && p.toks.length <= 8); const p = pool[Math.floor(Math.random() * pool.length)]; return p.toks.map(t => t.slice()); }

const CP = {S: null, sel: -1, engine: null, chords: null, notesKey: null, mode: 'chords', heard: null, heardAt: 0, pending: null, pendingAt: 0,

// where you are: the chord being heard (if fresh), else the selected bar, else the section's last bar
function cpFocus() {

  const b = cpBars(); if (!b.length) return {chord: null, from: 'none'};
  const i = CP.sel >= 0 && CP.sel < b.length ? CP.sel : b.length - 1;

// put a chord in the song: after the selected bar (walking forward), or at the end; 8 bars a section
function cpPlace(c) {

  if (CP.sel >= 0 && CP.sel < b.length - 1 && b.length >= 8) { b[CP.sel + 1] = tok; CP.sel++; }
  else if (b.length >= 8) { toast('A section holds 8 bars. Start the next section.'); return; }
  else { const at = CP.sel >= 0 ? CP.sel + 1 : b.length; b.splice(at, 0, tok); CP.sel = at; }

// change the key. keepSound: the same chords, re-read from a new home; otherwise the song moves (I stays I)
function cpSetKey(tonic, minor, keepSound) {

  if (keepSound) { const old = cpKey(), nk = Suggest.keyOf(tonic, minor ? 'minor' : 'major');
    for (const s in S.sections) S.sections[s] = S.sections[s].map(t => Suggest.tokenOf(nk, Suggest.chordOf(old, t))); }
  else if (minor !== S.minor) for (const s in S.sections) S.sections[s] = S.sections[s].map(t => convert(t, S.minor, minor));

/* ---------------- your song: sections, bars, form, and where it sits */
function cpRenderSong() {

    style: s === S.active ? `background:${SECCOL[s] || 'var(--ink)'};border-color:${SECCOL[s] || 'var(--ink)'};color:var(--onacc)` : '',
    on: {click: () => { S.active = s; CP.sel = -1; cpSave(); cpAll(); }}}, s + (S.sections[s].length ? ` · ${S.sections[s].length}` : ''))));
  const bars = h('div', {class: 'cp-bars'}, b.map((t, i) => {

      h('span', {class: 'cn'}, c.name), h('span', {class: 'rn'}, c.roman), i === CP.sel ? h('span', {class: 'cp-x', 'aria-label': `remove bar ${i + 1}`}, '×') : '');

// only speaks when it has something to say: the chords fit another key better than the one that's set

  if (all.length < 3) return null;

    h('button', {class: 'btn small', on: {click: () => { cpSetKey(r.best.tonic, r.best.mode === 'minor', true); toast(`Now in ${r.best.label}: the same chords, read from a new home`); }}}, `Re-read in ${r.best.label}`));

// loop the section, or play the whole song in its form, in the chosen pick pattern (the book's own strokes: D U X chop B bass), a click on the beats
function cpLoop(which) {
  if (CP.playing) { const was = CP.playing; Seq.stop(); if (was === which) return; }
  const S = cpSong(), order = which === 'song' ? S.form : [S.active], flat = [], where = [];
  order.forEach(sc => (S.sections[sc] || []).forEach((t, i) => { flat.push(cpChord(t)); where.push([sc, i]); }));
  if (!flat.length) { toast('Add some chords first'); return; }

/* ---------------- the compass
   The circle of fifths: majors outside, their relative minors inside. A key's seven chords sit together as
   one lit wedge (IV–I–V outside, ii–vi–iii inside), so distance on the dial is distance in harmony: the
   common next moves (gold) are close, the further-out ones (rust) just past the wedge. */
const CP_COF = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5], CP_R = {out: 212, mid: 158, inn: 110, hub: 104};
const cpPolar = (r, deg) => [220 + r * Math.sin(deg * Math.PI / 180), 220 - r * Math.cos(deg * Math.PI / 180)];
const cpArc = (r, a0, a1) => { const [x0, y0] = cpPolar(r, a0), [x1, y1] = cpPolar(r, a1); return `M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}`; };
function cpSector(r0, r1, a0, a1) {
  const [x0, y0] = cpPolar(r1, a0), [x1, y1] = cpPolar(r1, a1), [x2, y2] = cpPolar(r0, a1), [x3, y3] = cpPolar(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}
function cpCell(c) {

  return minorish ? {ring: 'inn', i: CP_COF.indexOf((c.root + 3) % 12), dim: ['°', 'm7♭5'].includes(c.quality)} : {ring: 'out', i: CP_COF.indexOf(c.root)};
}
const cpKeyName = (pc, mode) => KeyFinder.KEYS.find(x => x.tonic === pc && x.mode === mode).name;   // the circle's own spellings
function cpRenderDial() {

  if (cur) {

    Suggest.nextMoves(k, cur, {limit: 4}).forEach(x => { const c = cpCell(x); if (c && !c.dim) mark[`${c.ring}:${c.i}`] = 'gold'; });
  }
  const at = cpCell(cur), o = [`<circle cx="220" cy="220" r="${CP_R.out + 6}" fill="none" stroke="var(--rule)"/>`];
  for (let i = 0; i < 12; i++) {

    for (const [ring, r0, r1, chord] of [['out', CP_R.mid, CP_R.out, {root: CP_COF[i], quality: ''}], ['inn', CP_R.inn, CP_R.mid, {root: (CP_COF[i] + 9) % 12, quality: 'm'}]]) {
      const inKey = safe.slice(0, 7).some(x => cpSame(x, chord)), m = mark[`${ring}:${i}`], isCur = at && !at.dim && at.ring === ring && at.i === i;
      // in the key or suggested: spelled by the key, with its numeral; elsewhere the circle's names
      const d = inKey || m ? Suggest.describe(k, chord) : {name: ring === 'out' ? cpKeyName(chord.root, 'major') : cpKeyName(chord.root, 'minor') + 'm', roman: ''};
      const home = chord.root === k.tonic && (k.mode === 'minor') === (ring === 'inn'), [tx, ty] = cpPolar((r0 + r1) / 2, i * 30);
      o.push(`<g class="cp-cell" data-root="${chord.root}" data-q="${chord.quality}" role="button" tabindex="0" aria-label="${d.name}${d.roman ? ', ' + d.roman : ''}${inKey ? ', in the key' : ''}">`
        + `<path d="${cpSector(r0, r1, a0, a1)}" fill="${inKey ? 'var(--cp-wedge)' : 'transparent'}" stroke="${isCur ? 'var(--ink)' : 'var(--rule)'}" stroke-width="${isCur ? 2.6 : 1}"/>`
        + (m ? `<path d="${cpArc(ring === 'out' ? r1 - 3.5 : r0 + 3.5, a0 + 3, a1 - 3)}" fill="none" stroke="var(--${m})" stroke-width="5" stroke-linecap="round"/>` : '')
        + `<text x="${tx}" y="${ty + 2}" text-anchor="middle" font-size="${ring === 'out' ? (d.name.length > 2 ? 17 : 20) : (d.name.length > 3 ? 13 : 15)}" fill="${inKey || isCur ? 'var(--ink)' : 'var(--mute)'}"${home ? ' text-decoration="underline"' : ''} style="font-family:var(--display)">${d.name}</text>`
        + (d.roman ? `<text x="${tx}" y="${ty + (ring === 'out' ? 17 : 14)}" text-anchor="middle" font-size="10" font-weight="700" fill="${inKey ? 'var(--teal)' : 'var(--mute)'}">${d.roman}</text>` : '') + '</g>');
    }
  }
  o.push(`<circle cx="220" cy="220" r="${CP_R.hub}" fill="var(--bg)" stroke="var(--rule)"/>`);
  if (at) {   // a compass bezel: a rust arc on the hub's rim and a point reaching the rings, turning the short way
    const d = ((at.i * 30 - CP.needle) % 360 + 540) % 360 - 180; CP.needle += d;

/* ---------------- listening: the needle follows what you play */
function cpRenderLive() {
  const heard = cpEl('cp-heard'); if (!heard) return;
  const on = CP.engine && CP.engine.state === 'listening';
  const lb = cpEl('cp-listen'); lb.classList.toggle('on', on); lb.lastChild.textContent = on ? 'Stop' : 'Listen';
  const fresh = CP.heard && performance.now() - CP.heardAt < 4000;
  if (CP.mode === 'chords' && fresh) { const d = Suggest.describe(cpKey(), CP.heard); heard.textContent = d.name; heard.classList.remove('dim'); cpEl('cp-heardsub').textContent = `${d.roman} in ${cpKey().name} ${cpKey().mode}`; }
  else if (!(CP.mode === 'notes' && on && heard.textContent !== '–')) { heard.textContent = '–'; heard.classList.add('dim'); cpEl('cp-heardsub').textContent = on ? 'listening' : 'not listening'; }
}
// tell the player when the whole mandolin is out of tune (the engine has learned it and allows for it)
function cpTuning(cents) {
  const el = cpEl('cp-tune'); if (!el) return;
  const c = Math.round(cents || 0), txt = Math.abs(c) >= 10 ? `Your mandolin is about ${Math.abs(c)} cents ${c < 0 ? 'flat' : 'sharp'}; notes are read against its own tuning.` : '';
  if (el.textContent !== txt) el.textContent = txt;
}
// the live meter: loudness on a log scale (0.001 RMS at the left, 0.3 at the right), the gate as a mark,
// green once the mic hears more than the room; in Notes mode the note being played and how many cents off
function cpMeter(v) {
  const m = cpEl('cp-meter'); if (!m) return;
  const lv = r => Math.max(0, Math.min(1, (Math.log10(Math.max(r || 0, 1e-4)) + 3) / 2.5));
  cpEl('cp-lvl').style.width = `${lv(v.rms) * 100}%`;
  cpEl('cp-gate').style.left = v.gate ? `${lv(v.gate) * 100}%` : '0';
  m.classList.toggle('hot', !!v.gate && v.rms >= v.gate);
  const c = cpEl('cp-cents');
  if (v.calibrating) { c.textContent = 'listening to the room…'; c.classList.remove('ok'); return; }
  if (CP.mode === 'notes' && v.note) {
    const cents = Math.round(v.note.cents); c.textContent = `${v.note.name}${v.note.octave} · ${cents === 0 ? 'right on' : Math.abs(cents) + ' cents ' + (cents > 0 ? 'sharp' : 'flat')}`; c.classList.toggle('ok', Math.abs(cents) <= 5);
    const hb = cpEl('cp-heard'); hb.textContent = v.note.name + v.note.octave; hb.classList.remove('dim'); cpEl('cp-heardsub').textContent = `${v.note.freq.toFixed(1)} Hz`;
  } else {
    const t = CP.take, bar = t && t.bars ? (t.startAt ? `bar ${Math.min(t.bars, Math.floor((performance.now() - t.startAt) / t.barMs) + 1)} of ${t.bars} · ` : `play to start the ${t.bars} bars · `) : '';
    c.textContent = v.gate ? bar + (v.rms >= v.gate ? 'hearing you' : 'quiet') : ''; c.classList.remove('ok');
  }
}
/* ---------------- a take: listen for a set number of bars (or until Stop), keep the chords heard in order,

function cpTakeTick(v) {
  const t = CP.take; if (!t || !t.bars) return;
  const now = performance.now();
  if (!t.startAt) { if (!v.calibrating && v.gate != null && v.rms >= v.gate) t.startAt = now; return; }   // the clock starts at the first sound
  if (now - t.startAt >= t.bars * t.barMs) setTimeout(cpStopListen, 0);
}
function cpTakeAdd(e) {
  const t = CP.take; if (!t || e.durationMs < 300) return;                       // a chord shorter than that is a change in progress
  const last = t.chords[t.chords.length - 1];
  if (last && last.root === e.root && last.quality === e.quality) last.ms += e.durationMs; else t.chords.push({root: e.root, quality: e.quality, ms: e.durationMs});
}
function cpTakeReport() {
  const t = CP.take; if (!t) return; CP.take = null;
  const last = t.chords[t.chords.length - 1];                                     // the chord still ringing at the end counts too
  if (CP.heard && performance.now() - CP.heardAt < 4000 && !(last && cpSame(last, CP.heard))) t.chords.push({root: CP.heard.root, quality: CP.heard.quality, ms: 700});
  const m = cpEl('cp-msg'); if (!m || !t.chords.length) return;
  cpChipsShown(false);

  const kf = KeyFinder.create();

    h('div', {class: 'heard'}, h('span', {class: 'lbl'}, `heard ${count}`), ...t.chords.map(c => h('b', {}, Suggest.describe(k, c).name)),
      h('button', {class: 'x', 'aria-label': 'dismiss', title: 'dismiss', on: {click: () => cpMsg('')}}, '×')),

      h('button', {class: 'chip', on: {click: () => cpTakeWrite(t.chords)}}, 'Write them in'))));
}
// write the take's chords into the section, after the selected bar or at the end; 8 bars a section

      const b = e.currentTarget; if (b.dataset.key) { const [t, m] = b.dataset.key.split(':'); cpSetKey(+t, m === 'minor', true); toast(`Key set to ${b.textContent.slice(4)}`); return; }
      const c = CP.heard || (CP.lastEnd && {root: CP.lastEnd.root, quality: CP.lastEnd.quality}); if (c) { cpPlace(c); toast(`${cpName(c)} added`); } }}}, 'Add to song'),
      h('label', {class: 'row', style: 'gap:6px;font-weight:700;font-size:14px'}, auto, 'Write what I play')));
  v.append(h('div', {class: 'cp-studio'},
    sec2('Your song', 'tap a bar, then a chord on the wheel', 'var(--rust)', h('div', {id: 'cp-song', class: 'cp-songbox'})),
    h('div', {class: 'cp-dialcol'},
      h('div', {html: `<svg id="cp-dial" class="cp-dial" viewBox="0 0 440 440" role="img" aria-label="The song compass: the circle of fifths with your key lit"></svg>`}),

/* Song Compass — pitch engine (Phase 1).
   Audio and pitch logic only: no DOM, no drawing. The page (compass-ui.js) listens to it.
   Written as a classic script that defines one global, PitchEngine, so Phase 5 can paste it
   straight into pwa/book.template.html the same way build_book.py splices in the app's core.

   Pieces, from the bottom up:
     yin(buf, sampleRate)      one block of samples -> {freq, clarity} or null
     noteOf(freq)              a frequency -> note name, octave, MIDI number, cents off
     createTracker()           frame-by-frame detections -> steady notes + a history of note events
     create()                  wires the microphone to all of the above
   The first three are pure (no browser needed), so they can be tested with fake signals in Node. */
const PitchEngine = (() => {
  'use strict';

  // Spelled the way the book spells them (app.template.html, SH). Phase 2 will re-spell by key.
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

  const DEFAULTS = {
    minFreq: 70,          // a little under low E (82.4 Hz), so drop-D (73.4 Hz) still reads
    maxFreq: 1400,        // a little over the 24th fret of the high E (1319 Hz)
    threshold: 0.15,      // YIN's dip threshold: lower = stricter, fewer octave mistakes, more misses
    octaveRatio: 0.3,     // double the period wins if it matches about 3x better (see step 3b)
    octaveFloor: 0.004,   // ...unless the first match was already near-perfect. Both tuned on 83 real recordings
    octaveEnergy: 0.0025, // ...and only if the lower note's odd harmonics are really there (power ratio)
    subharmonics: [2, 3], // periods to second-guess: double (octave errors) and triple (twelfth errors)
    twelfthEnergy: 20,    // a triple period needs this many times more in-between energy than an octave (swept
                          // 5–300: 20 fixes a low A read as E4 at almost no cost; 5 adds false notes)
    minClarity: 0.8,      // below this we say "not sure" rather than show a wrong note
    holdFrames: 3,        // a new note must repeat this many frames (~50 ms) before it's shown
    releaseMs: 140,       // silence/uncertainty this long ends the current note
    minNoteMs: 60,        // a note event shorter than this is dropped as a blip
    historySize: 16,
    bufferSize: 4096,     // samples copied from the (filtered) mic each frame, for pitch
    rawSize: 0,           // >0: also tap the UNfiltered mic (8192 for chords) and emit it as 'raw'
    absGate: 0.0015,      // the gate never drops below this loudness (RMS), whatever the room. Was 0.006: a
                          // quiet player lost over half their notes (GuitarSet at 1/4 volume: 41% → 76% found)
    gateRatio: 2,         // ...and otherwise sits this many times above the room's own background
    adaptTuning: false,   // name notes relative to the guitar's own tuning (see createAnalyzer); a tuner
                          // must leave this off, the Song Compass turns it on
    highpass: 180,        // the mic chain's filters (Hz); the tests apply the same ones (test-samples.js).
                          // 180, not 60: body boom and ringing low strings muddy the pitch (GuitarSet
                          // solos 78.6% → 82.1%); low E still reads, from its overtones
    lowpass: 2200,
    context: null,        // optional () => AudioContext, to share the host page's (the book's audio())
    windowSize: 1536,     // samples YIN looks at (the newest ones): low E still fits; swept 1536/2048/3072
    onsetRatio: 2.5,      // a pluck = the newest ~16 ms is this many times louder than just before
    onsetHoldMs: 90,      // a pluck counts for this long (the pitch takes a few frames to come clear)
    minRepeatMs: 90,      // a re-pluck of the same note sooner than this is the same pluck
    a4: 440,
  };

  /* ------------------------------------------------------------------ YIN
     YIN (de Cheveigné & Kawahara, 2002) finds the period of a wave: the time until it repeats.

     Step 1, the difference function. For each candidate lag `tau` (a shift in samples), slide the
     wave against itself and add up the squared gaps:  d(tau) = Σ (x[j] - x[j+tau])².
     If the wave repeats every `tau` samples, the copy lands on top of the original and d(tau) ≈ 0.

     Step 2, normalise. Plain d(tau) also dips at 2×, 3×... the true period (the wave repeats there
     too) and is always 0 at tau = 0. YIN divides each d(tau) by the running average of all the
     d values before it:  d'(tau) = d(tau) · tau / Σ_{k=1..tau} d(k).  Now d' starts at 1, and a
     dip only counts if it is deep compared with everything before it.

     Step 3, the absolute threshold. Take the FIRST lag where d' drops under the threshold (then
     slide to the bottom of that dip). Taking the first, not the deepest, is what stops "octave
     errors": the true period is the earliest good match; 2× the period is a later, equally good one.

     Step 4, parabolic interpolation. The real period rarely falls on a whole sample. Fit a parabola
     through the dip and its two neighbours and take its lowest point: sub-sample accuracy, which is
     what makes the cents reading trustworthy.

     Clarity = 1 - d'(tau): 1 is a perfect repeat, 0 is noise. That is our confidence. */
  function yin(buf, sampleRate, opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const tauMin = Math.max(2, Math.floor(sampleRate / o.maxFreq));
    // the comparison window must hold at least one full period of the lowest note, plus the shift
    const tauMax = Math.min(Math.ceil(sampleRate / o.minFreq), Math.floor(buf.length / 2));
    const W = buf.length - tauMax;                       // how many samples each comparison sums over
    if (tauMax <= tauMin + 2 || W < tauMax) return null;

    // Step 1 + 2 together: difference function, then cumulative-mean normalisation
    const dp = new Float32Array(tauMax + 1);
    dp[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let sum = 0;
      for (let j = 0; j < W; j++) { const g = buf[j] - buf[j + tau]; sum += g * g; }
      running += sum;
      dp[tau] = running > 0 ? sum * tau / running : 1;
    }

    // Step 3: first dip under the threshold (inside the guitar's range), walked to its bottom
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (dp[t] < o.threshold) {
        while (t + 1 < tauMax && dp[t + 1] < dp[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) {
      // nothing cleared the bar: fall back to the deepest dip, and let its low clarity say "unsure"
      let best = tauMin;
      for (let t = tauMin + 1; t < tauMax; t++) if (dp[t] < dp[best]) best = t;
      tau = best;
    }
    if (tau <= tauMin || tau >= tauMax) return null;    // a dip at the edge of the range isn't a real pitch

    // Step 3b, the octave check (added after testing real recordings). As a plucked string rings,
    // its fundamental fades faster than its 2nd harmonic, so the wave comes to ALMOST repeat every
    // half period and step 3 lands an octave too high. A true period shows an even better match
    // at double the lag; a real note's double lag is only ever about as good, never much better.
    // Dips are compared at their parabola-refined bottoms (step 4's trick): at high notes a period of
    // 33.4 samples looks worse at 33 than its double does at 67, just from where the samples fall.
    const refine = t => {
      const a = dp[t - 1], b = dp[t], c = dp[t + 1], den = a - 2 * b + c;
      if (!(den > 0)) return {at: t, depth: b};
      const s = Math.max(-0.5, Math.min(0.5, (a - c) / (2 * den)));
      return {at: t + s, depth: Math.max(0, b - (a - c) * s / 4)};
    };
    // The same test for a period three times as long (the "twelfth" error: a low A whose fundamental
    // and 2nd harmonic are faint reads as the E above, its 3rd harmonic). For k = 3 the lower note's
    // tell-tale harmonics sit at 1/3, 2/3, 4/3 and 5/3 of the higher reading.
    for (let guard = 0; guard < 3; guard++) {
      let moved = false;
      for (const k of o.subharmonics) {
        const tk = tau * k;
        if (tk + 2 >= tauMax) continue;
        let bk = tk;
        for (let t = tk - 2; t <= tk + 2; t++) if (dp[t] < dp[bk]) bk = t;   // the dip may sit a sample off
        const one = refine(tau), lower = refine(bk);
        // only second-guess a so-so match: when the first dip is already near-perfect (clean high
        // notes), both numbers are tiny and their ratio is just noise
        if (!(one.depth > o.octaveFloor && lower.depth < one.depth * o.octaveRatio)) continue;
        // Last word goes to the spectrum: if the note really is lower, there must be actual sound at its
        // harmonics that aren't also harmonics of the higher reading (for an octave: ½, 1½, 2½ of it).
        // If there's next to nothing there, the lower note is a phantom of the maths. (Measured on the
        // recordings: every wrong halving had under 0.3% of such energy; nearly all right ones had more.)
        const fh = sampleRate / one.at;
        let odd = 0;
        for (let j = 1; j < 3 * k; j++) if (j % k) odd += power(buf, sampleRate, fh * j / k);
        const even = power(buf, sampleRate, fh) + power(buf, sampleRate, fh * 2);
        if (odd > even * o.octaveEnergy * (k === 2 ? 1 : o.twelfthEnergy)) { tau = bk; moved = true; break; }
      }
      if (!moved) break;
    }

    // Step 4: parabola through (tau-1, tau, tau+1); its vertex is the refined period
    const a = dp[tau - 1], b = dp[tau], c = dp[tau + 1], den = a - 2 * b + c;
    const shift = den > 0 ? (a - c) / (2 * den) : 0;    // always within ±0.5 of a sample
    const period = tau + Math.max(-0.5, Math.min(0.5, shift));
    const freq = sampleRate / period;
    if (freq < o.minFreq || freq > o.maxFreq) return null;
    return {freq, clarity: Math.max(0, Math.min(1, 1 - b))};
  }

  /* The Goertzel algorithm: how much of ONE frequency is in a block of sound. It's a single bin of a
     Fourier transform (FFT), so it's far cheaper than a whole FFT when you only need to ask about a
     few frequencies. The Hann window fades the block's edges so the cut-off ends don't smear energy. */
  function power(buf, sampleRate, f) {
    const N = buf.length, c = 2 * Math.cos(2 * Math.PI * f / sampleRate);
    let s1 = 0, s2 = 0;
    for (let i = 0; i < N; i++) {
      const s = buf[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1))) + c * s1 - s2;
      s2 = s1; s1 = s;
    }
    return s1 * s1 + s2 * s2 - c * s1 * s2;
  }

  /* ------------------------------------------------------------------ frequency -> note
     MIDI numbers count semitones (frets): A4 = 440 Hz = 69, and each semitone up multiplies the
     frequency by 2^(1/12). So the semitone count is 12 · log2(f / 440) above 69. Rounding gives the
     nearest note; what's left over, times 100, is the cents (a semitone = 100 cents). */
  function noteOf(freq, a4 = DEFAULTS.a4) {
    const exact = 69 + 12 * Math.log2(freq / a4);
    const midi = Math.round(exact);
    const pitchClass = ((midi % 12) + 12) % 12;          // 0 = C ... 11 = B, octave thrown away
    return {
      midi, pitchClass, name: NAMES[pitchClass],
      octave: Math.floor(midi / 12) - 1,                 // MIDI 60 = C4 (middle C), so octave = midi/12 - 1
      cents: (exact - midi) * 100,                       // -50 .. +50
      freq,
    };
  }

  /* RMS (root mean square): square every sample, average, square-root. A fair "how loud" that
     doesn't cancel out just because a wave swings both above and below zero. */
  function rmsOf(buf) {
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
  }

  const median = xs => { const s = [...xs].sort((p, q) => p - q), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  /* ------------------------------------------------------------------ the tracker
     Turns a jittery stream of per-frame guesses into (a) one steady "current note" for the display
     and (b) a clean history of note EVENTS for Phase 2's key finder.
     It never touches the mic, so tests can feed it fake frames with fake timestamps.

     A history event looks like:
       { id, midi, pitchClass, name, octave, freq, cents, confidence, startedAt, durationMs, ended }
     durationMs matters: the Krumhansl key method weighs each pitch by how long it sounded. */
  function createTracker(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    let candidate = null, candidateCount = 0;    // the note we're auditioning before showing it
    let current = null;                          // the note being shown (null = nothing confident)
    let lastGood = 0;                            // time of the last confident frame for `current`
    let recent = [];                             // the last few frequencies of `current`, for a median
    let event = null;                            // the history event being held right now
    let nextId = 1, lastOnset = -1e9, onsetUsed = -1e9, repluck = null;   // repluck: a same-pitch pluck being confirmed
    let votes = {};                              // frames heard per octave of the current note
    const history = [];
    const listeners = {note: [], noteend: []};
    const emit = (k, v) => listeners[k].forEach(f => f(v));

    function closeEvent(now) {
      if (!event) return;
      event.durationMs = Math.max(0, now - event.startedAt);   // `now` is the last frame that really heard it
      event.ended = true;
      const ev = event; event = null;
      if (ev.durationMs < o.minNoteMs) {         // a blip: forget it was ever logged
        const i = history.indexOf(ev); if (i >= 0) history.splice(i, 1);
        return;
      }
      emit('noteend', ev);
    }
    function openEvent(n, now, confidence) {
      closeEvent(now);
      event = {id: nextId++, midi: n.midi, pitchClass: n.pitchClass, name: n.name, octave: n.octave,
        freq: n.freq, cents: n.cents, confidence, startedAt: now, durationMs: 0, ended: false};
      history.push(event);
      while (history.length > o.historySize) history.shift();
      emit('note', event);
    }

    /* Feed one analysis frame.  det = yin()'s result or null; rms = loudness; gated = too quiet;
       onset = the onset detector heard a fresh pluck this frame. Returns what to show right now. */
    function push(det, rms, now, gated, onset = false) {
      const ok = !gated && det && det.clarity >= o.minClarity;
      const n = ok ? noteOf(det.freq, o.a4) : null;
      // a pluck heard recently (the pitch can take a frame or two to come clear after it)
      if (onset) lastOnset = now;
      const attack = now - lastOnset < o.onsetHoldMs;

      if (n) {
        // A string can't leap a whole octave on its own. An exact octave (or two) away from the
        // ringing note, with no fresh pluck, is the detector slipping on a harmonic: same note.
        // Which octave it IS gets decided by majority over the note's life, not by its first few
        // frames (the pick's attack is the noisiest moment, and it once locked F♯4 in as F♯3).
        if (current && n.midi !== current.midi && (n.midi - current.midi) % 12 === 0 && !attack) {
          lastGood = now; candidate = null; candidateCount = 0;
          votes[n.midi] = (votes[n.midi] || 0) + 1;
          if (votes[n.midi] > (votes[current.midi] || 0)) {        // the other octave has won: relabel
            current = n; recent = [det.freq];
            if (event) Object.assign(event, {midi: n.midi, name: n.name, octave: n.octave, freq: n.freq, cents: n.cents});
          } else {
            if (event) event.durationMs = now - event.startedAt;
            return {note: noteOf(median(recent), o.a4), confidence: det.clarity};
          }
        }
        if (current && n.midi === current.midi) {
          votes[n.midi] = (votes[n.midi] || 0) + 1;
          lastGood = now; candidate = null; candidateCount = 0;
          recent.push(det.freq); if (recent.length > 7) recent.shift();
          // Re-plucking the same note: same pitch, but a fresh onset starts a new event (A, A = two
          // notes). Only once the pitch has STAYED the same for holdFrames after the pluck, though: when
          // you move to a new note, the window still holds the old one for a frame or two.
          if (attack && lastOnset > onsetUsed && event && lastOnset - event.startedAt > o.minRepeatMs) {
            if (!repluck || repluck.at !== lastOnset) repluck = {at: lastOnset, count: 0};
            if (++repluck.count >= o.holdFrames) { onsetUsed = lastOnset; repluck = null; openEvent(current, lastOnset, det.clarity); }
          }
        } else {
          // a different note: it has to show up `holdFrames` times in a row before we switch to it
          repluck = null;
          if (candidate && candidate.midi === n.midi) candidateCount++;
          else { candidate = n; candidateCount = 1; }
          if (candidateCount >= o.holdFrames) {
            current = n; recent = [det.freq]; lastGood = now; candidate = null; candidateCount = 0;
            votes = {[n.midi]: o.holdFrames}; repluck = null;
            if (attack) onsetUsed = lastOnset;               // this pluck is spent on this note
            openEvent(n, now, det.clarity);
          }
        }
      }
      // nothing confident for long enough: the note has ended
      if (current && now - lastGood > o.releaseMs) {
        closeEvent(lastGood);
        current = null; recent = [];
      }

      if (!current) return {note: null, confidence: ok ? det.clarity : (det ? det.clarity : 0)};
      // the display uses the median of recent frames: one bad frame can't yank the needle
      const shown = noteOf(median(recent), o.a4);
      // only frames that actually hear the note lengthen it: the release wait isn't playing time
      if (event && ok && n.midi === event.midi) {
        event.durationMs = now - event.startedAt;
        event.freq = shown.freq; event.cents = shown.cents;     // a running best estimate of its pitch
        event.confidence = Math.max(event.confidence, det.clarity);
      }
      return {note: shown, confidence: ok ? det.clarity : 0};
    }

    return {
      push,
      setA4(a4) { o.a4 = a4; },                 // the reference pitch notes are named against (see adaptTuning)
      flush(now) { closeEvent(now); current = null; candidate = null; recent = []; },
      on(k, f) { listeners[k].push(f); return () => { listeners[k] = listeners[k].filter(g => g !== f); }; },
      get history() { return history.map(e => ({...e})); },   // copies, so nobody edits ours by accident
      clear() { history.length = 0; event = null; },
    };
  }

  /* ------------------------------------------------------------------ one frame at a time
     createAnalyzer does everything that happens to one block of samples: noise gate, onset detector,
     YIN, tracker. The live mic loop and the tests both feed it, so the tests measure the live code.
     process(buf, now): buf = the newest samples (the AnalyserNode's 4096), now = time in ms. */
  function createAnalyzer(sampleRate, opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const tracker = createTracker(o);
    const tail = Math.round(sampleRate * 0.016);       // ~16 ms: about one frame's worth of new sound
    let startedAt = null, noiseFloor = Infinity, tails = [];

    /* Noise gate. For the first ~0.6 s we measure the room: the QUIETEST moment, not the average, so
       pressing Start mid-strum doesn't teach it that the guitar is background noise (capped too).
       Then the gate is 3x that level, never below an absolute floor, and keeps re-learning slowly
       while it's quiet so a noisier room doesn't make it fire on the fridge. */
    const CALIBRATE_MS = 600, MAX_FLOOR = 0.01;
    function gateFor(rms, now) {
      if (startedAt == null) startedAt = now;
      if (now - startedAt < CALIBRATE_MS) { noiseFloor = Math.min(noiseFloor, rms, MAX_FLOOR); return Infinity; }
      if (!isFinite(noiseFloor)) noiseFloor = 0;
      const gate = Math.max(o.absGate, noiseFloor * o.gateRatio);
      if (rms < gate) noiseFloor = Math.min(MAX_FLOOR, noiseFloor * 0.995 + rms * 0.005);
      return gate;
    }

    /* Onset detector. A pick or finger hitting a string is a sudden burst of energy. Each frame we
       measure only the newest ~16 ms (the rest of the buffer is old news) and flag an onset when it's
       onsetRatio times louder than the quietest of the last few frames, and still rising. This catches
       a re-plucked note, which pitch alone can't (A then A has no pitch change). */
    function onsetIn(buf, gate) {
      let e = 0; for (let i = buf.length - tail; i < buf.length; i++) e += buf[i] * buf[i];
      e /= tail;
      const before = tails.length >= 3 ? Math.min(...tails.slice(-3)) : Infinity, prev = tails[tails.length - 1];
      tails.push(e); if (tails.length > 6) tails.shift();
      return isFinite(gate) && Math.sqrt(e) > gate && e > before * o.onsetRatio && e > prev * 1.2;
    }

    /* The guitar's own tuning. Amateur guitars are often a little sharp or flat all over, and a note 25
       cents flat sits halfway to the next one down, so vibrato tips it into the wrong name (GuitarSet
       detuned 25 cents: notes found fell from 79% to 42%). So we keep a running average of how far
       steady, confident notes sit from A = 440, and name notes against that. Cents wrap round (+49 and
       −49 are neighbours), so the average is circular: each offset is a point on a circle, and the
       direction of their mean is the offset. Applied once there's enough evidence and it's more than
       10 cents off. The offset is reported, so a page can say "your guitar is about 25 cents flat". */
    let tx = 0, ty = 0, tN = 0, tuning = 0;
    function learnTuning(det) {
      const c = 1200 * Math.log2(det.freq / 440), a = 2 * Math.PI * c / 100;
      tx = tx * 0.98 + Math.cos(a) * 0.02; ty = ty * 0.98 + Math.sin(a) * 0.02; tN++;
      const r = Math.hypot(tx, ty) / (1 - Math.pow(0.98, tN)), off = Math.atan2(ty, tx) * 100 / (2 * Math.PI);
      tuning = tN >= 40 && r > 0.6 && Math.abs(off) >= 10 ? off : (Math.abs(off) < 6 ? 0 : tuning);
      tracker.setA4(440 * Math.pow(2, tuning / 1200));
    }

    function process(buf, now) {
      const win = buf.length > o.windowSize ? buf.subarray(buf.length - o.windowSize) : buf;
      const rms = rmsOf(win), gate = gateFor(rms, now), gated = rms < gate;
      const onset = onsetIn(buf, gate);
      const det = gated ? null : yin(win, sampleRate, o);         // skip the maths when it's quiet
      if (o.adaptTuning && det && det.clarity >= 0.9) learnTuning(det);
      const view = tracker.push(det, rms, now, gated, onset);
      return {...view, rms, onset, gate: isFinite(gate) ? gate : null, calibrating: !isFinite(gate), raw: det, sampleRate,
        tuning, a4: 440 * Math.pow(2, tuning / 1200)};
    }
    return {process, tracker, flush: now => tracker.flush(now)};
  }

  /* ------------------------------------------------------------------ the microphone
     Signal path:  mic -> high-pass 60 Hz -> low-pass 2.2 kHz -> AnalyserNode
     The high-pass removes rumble (desk bumps, AC hum's lowest part) below the guitar's range; the
     low-pass trims the bright upper harmonics that make the wave messier without changing its pitch.
     The AnalyserNode is a tap: every animation frame (~60 a second) we copy out its newest 4096
     samples and hand them to createAnalyzer (which uses the newest 2048 for pitch). */
  function create(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const listeners = {frame: [], state: [], note: [], noteend: [], raw: []};
    const emit = (k, v) => listeners[k].forEach(f => f(v));
    let ctx = null, stream = null, nodes = [], raf = 0, buf = null, analyser = null, an = null, rawAnalyser = null, rawBuf = null;
    let state = 'idle', kept = [];                      // kept: finished notes, carried across Stop/Start

    const setState = (s, detail) => { state = s; emit('state', {state: s, detail}); };

    function loop() {
      analyser.getFloatTimeDomainData(buf);
      const view = an.process(buf, performance.now());
      emit('frame', view);

  holding: [

    Q('The picking motion should come from:', 'the wrist, with a small movement', ['the whole arm from the shoulder', 'the fingers alone', 'the elbow only'], 'Small and loose.', 'A loose wrist moving a little lets the pick alternate fast and even. Arm picking is slow and tires; finger picking has no power.'),

  tuningq: [

    () => { const tr = _TR[rnd(_TR.length)]; return {q: `Which tradition is this: “${tr.blurb.split(':')[0]}”?`, a: tr.name, opts: strOpts(tr.name, _TR.map(x => x.name)), hint: cap(tr.sound) + '.', why: `${tr.name}: ${tr.blurb}`}; },
    () => { const tr = _TR[rnd(_TR.length)], k = tr.keys[rnd(tr.keys.length)]; return {q: `${tr.name} playing lives mostly in which keys?`, a: tr.keys.join(', '), opts: strOpts(tr.keys.join(', '), _TR.map(x => x.keys.join(', '))), hint: cap(tr.sound) + '.', why: `${tr.name}: ${tr.keys.join(', ')}. ${tr.tunes}.`}; },
    () => { const t = D.tunes[rnd(D.tunes.length)]; return {q: `“${t.name}” is in:`, a: `${t.key} ${SCALE_BY[t.scale].name}, ${t.meter}`, opts: strOpts(`${t.key} ${SCALE_BY[t.scale].name}, ${t.meter}`, D.tunes.map(x => `${x.key} ${SCALE_BY[x.scale].name}, ${x.meter}`).concat([`${t.key} Natural Minor, ${t.meter}`])), hint: cap(t.blurb) + '.', why: `${t.name}: ${t.key} ${SCALE_BY[t.scale].name} in ${t.meter}. ${cap(t.blurb)}.`, play: () => { audio(); const b = .4, unit = t.meter.endsWith('/8') ? b / 3 : b; let at = A.ctx.currentTime + .03; t.notes.slice(0, 12).forEach(n => { if (!n.rest) course(n.midi, at, {gain: .36, kind: 'note', dur: n.dur * unit * .9}); at += n.dur * unit; }); }}; },
    Q('How many bars is one time through an AABB tune?', '32', ['16', '8', '64'], '8 × 4.', 'Four 8-bar parts: 32 bars. A fiddle tune is usually played three times through.'),
    Q('Bluegrass came from:', 'old-time string-band music, shaped by Bill Monroe in the 1940s', ['Italian opera', 'Irish sessions in Boston', 'jazz'], 'Monroe’s band.', 'Monroe took the old-time string band, added the chop, the blues and the high harmony, and named it after his band, the Blue Grass Boys.'),
    Q('The mandolin came to America from:', 'Italy — the Neapolitan bowl-back', ['Ireland', 'Scotland', 'Germany'], 'Santa Lucia.', 'The Neapolitan mandolin arrived with Italian immigrants in the 1880s; Gibson carved the flat, American version in the 1900s that bluegrass later adopted.'),
    Q('Old Joe Clark is the standard example of a tune in:', 'Mixolydian', ['Dorian', 'harmonic minor', 'the blues scale'], 'The G natural in A.', 'A Mixolydian: a major tune with a flat seventh and a G chord where you expect E.'),
  ],
};
// the chords-in-key ear question needs a real factory; replace the placeholder with one that computes its answer
QBANK.chordsinkey[QBANK.chordsinkey.length - 1] = () => { const k = rndKey(), rows = _CK[k].rows, r = rows[1 + rnd(5)]; return {q: `Listen: the I chord of ${k}, then another chord from the key. Is the second one major or minor?`, a: r.q === 'm' ? 'Minor' : 'Major', opts: shuffle(['Major', 'Minor']), hint: 'ii iii vi are minor; IV V are major.', why: `That was ${r.name}, the ${ROMAN[r.deg - 1]} of ${k}: ${r.q === 'm' ? 'minor' : 'major'}.`, play: () => { audio(); const t = A.ctx.currentTime + .02; mstrum(rows[0].shape, 'D', t); mstrum(r.shape, 'D', t + .9); }}; };
const ROMAN = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];

/* ---------------------------------------------------------------- the Index */
PAGES.push({id: 'index', no: 'VII', name: 'The Index', blurb: 'every term and idea in the book, organized', acc: 'var(--navy)', draw(v) {
  pageScroll = true;
  v.append(header('VII', 'The Index'));
  const st = state('indexpage', {sec: 'az'});
  const go = sec => { st.sec = sec; keep('indexpage', st); redraw(); };
  const navBtn = ([sec, label]) => h('button', {class: 'btn' + (st.sec === sec ? ' acc' : ''), style: 'justify-content:flex-start;text-align:left;min-height:42px', on: {click: () => go(sec)}}, label);
  const nav = h('div', {style: 'display:flex;flex-direction:column;gap:6px'},
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:2px'}, 'THE TERMS'),
    navBtn(['az', 'Everything A–Z']), ...IDX_GROUPS.map(g => navBtn([g[0], g[1]])),
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin:10px 0 2px'}, 'THE IDEAS'),
    ...INDEX_SUBS.filter(s => s[0] !== 'glossary').map(([k, nm]) => navBtn(['facts:' + k, nm])));
  const body = h('div', {style: 'display:flex;flex-direction:column;gap:12px;min-width:0'});
  const row = c => discovered(c.id) ? h('button', {class: 'gloss-row', 'data-c': c.id}, h('b', {}, c.term), h('span', {}, c.short))
    : h('button', {class: 'gloss-row unfound', 'data-c': c.id, title: 'Not found yet — it still opens'}, h('b', {}, '? ' + c.term), h('span', {}, `Not found yet · ${whereFound(c.id)}`));
  const nFound = (D.concepts || []).filter(c => discovered(c.id)).length, nAll = (D.concepts || []).length;
  if (!bookMode()) body.append(h('div', {class: 'found-bar'}, h('b', {}, `${nFound} of ${nAll} found`), h('span', {}, 'clear chapters, visit pages and tap terms in the book to collect them all'),
    h('div', {class: 'found-meter'}, h('i', {style: `width:${Math.round(nFound / nAll * 100)}%`}))));
  if (st.sec.startsWith('facts:')) {
    const k = st.sec.slice(6), name = (INDEX_SUBS.find(s => s[0] === k) || [])[1], facts = (D.theory.facts || []).filter(f => f.tag === k);
    body.append(sec2(name, 'the ideas behind the lessons · tap any term to open it', 'var(--navy)',
      h('div', {class: 'facts'}, facts.map(f => h('div', {class: 'fact'}, h('h3', {}, f.t), h('p', {html: glossify(f.b)}))))));
  } else if (st.sec === 'az') {
    const cs = (D.concepts || []).slice().sort((a, b) => a.term.localeCompare(b.term));
    const list = h('div', {class: 'gloss'}); let letter = '';
    cs.forEach(c => { const l = c.term[0].toUpperCase();
      if (l !== letter) { letter = l; list.append(h('div', {style: 'grid-column:1/-1;font-weight:900;color:var(--navy);margin:8px 0 0;letter-spacing:.1em'}, l)); }
      list.append(row(c)); });
    body.append(sec2('Everything A–Z', 'every term in the book · tap one to open it, then follow “see also”', 'var(--navy)', list));
  } else {
    const g = IDX_GROUPS.find(x => x[0] === st.sec) || IDX_GROUPS[0], byId = {}; (D.concepts || []).forEach(c => byId[c.id] = c);
    body.append(sec2(g[1], 'tap a term to open it · related terms link onward', 'var(--navy)',
      h('div', {class: 'gloss'}, g[2].filter(id => byId[id]).map(id => row(byId[id])))));
  }
  v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(185px,.3fr) minmax(0,1fr);align-items:start'}, nav, body));
}});


/* ---------------------------------------------------------------- motion: springs, touch-down feedback, morphing thumbs, fluid page turns */
/* ================================================================ MOTION: one spring, touch-down feedback, morphing thumbs, fluid page turns
   After Apple's WWDC18 "Designing Fluid Interfaces" and WWDC25 "Meet Liquid Glass":
   respond on touch-down and commit on touch-up; describe motion by damping and response, never duration;
   stay interruptible (a new touch takes over from wherever the motion is); things grow from where you touched
   and leave the way they came; materialize by sharpening out of a blur rather than fading. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
// a damped spring from 0 to 1: damping ratio ζ (1 = no overshoot), response T (seconds for one undamped cycle)
function springAt(t, zeta, T) {
  const w0 = 2 * Math.PI / T;
  if (zeta >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + zeta * w0 / wd * Math.sin(wd * t));
}
// the same spring as a CSS linear() easing and the time it takes to settle, so CSS and JS move alike
function springCSS(zeta, T) {
  let end = T; for (let t = T * 4; t > 0; t -= 0.004) if (Math.abs(1 - springAt(t, zeta, T)) > 0.001) { end = t + 0.004; break; }
  const pts = Array.from({length: 48}, (_, i) => +springAt(end * i / 47, zeta, T).toFixed(4)); pts[47] = 1;
  return {ease: `linear(${pts.join(', ')})`, ms: Math.round(end * 1000)};
}
// four springs for the whole book: press (quick, firm), snap (no overshoot), morph (a little squish), page (gentle)
const SPRINGS = {press: springCSS(1, .22), snap: springCSS(1, .38), morph: springCSS(.78, .42), page: springCSS(.9, .55)};
(() => { const r = document.documentElement.style; for (const [k, s] of Object.entries(SPRINGS)) { r.setProperty(`--sp-${k}`, s.ease); r.setProperty(`--sp-${k}-ms`, s.ms + 'ms'); } })();

/* ---------------- touch-down: press in at once, glow from the exact touch point, commit on release (the browser's click) */
const PRESSABLE = 'button,.cbox,.chip,select,.neckwrap';
let lastTap = {x: 0, y: 0, t: 0, el: null};
document.addEventListener('pointerdown', e => {
  lastTap = {x: e.clientX, y: e.clientY, t: performance.now(), el: e.target};
  const el = e.target.closest(PRESSABLE); if (!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--gx', `${e.clientX - r.left}px`); el.style.setProperty('--gy', `${e.clientY - r.top}px`);
  el.classList.remove('glow'); void el.offsetWidth; el.classList.add('pressing', 'glow');
  const up = () => { el.classList.remove('pressing'); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.removeEventListener('pointerleave', up); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
}, {passive: true});
document.addEventListener('animationend', e => { if (e.animationName === 'glow') e.target.classList.remove('glow'); });

/* ---------------- morphing thumbs: a segmented control's selection (and the key ring's) slides to its new place.
   The page redraws on every choice, so each group's last thumb rect is remembered by name and the new thumb
   springs from there (FLIP). */
const THUMBS = new Map();
function placeThumbs(v) {
  const pid = (PAGES[at] || {}).id;
  v.querySelectorAll('.seg, .keyring').forEach((g, n) => {
    if (g.classList.contains('multi')) return;   // a multi-select seg (the reading layers) keeps every pressed button lit; no single pill
    const on = g.querySelector('[aria-pressed="true"]'); if (!on) return;
    const key = `${pid}:${g.getAttribute('aria-label') || g.className}:${n}`;
    const th = h('span', {class: 'thumb', 'aria-hidden': 'true'}); g.prepend(th); g.classList.add('has-thumb');
    const put = () => { th.style.left = on.offsetLeft + 'px'; th.style.top = on.offsetTop + 'px'; th.style.width = on.offsetWidth + 'px'; th.style.height = on.offsetHeight + 'px'; };
    put();
    const was = THUMBS.get(key), now = {x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight};
    THUMBS.set(key, now);
    if (!was || REDUCED.matches || (was.x === now.x && was.y === now.y && was.w === now.w)) return;
    const dx = was.x - now.x, dy = was.y - now.y, sx = was.w / now.w;
    th.animate([{transform: `translate(${dx}px, ${dy}px) scaleX(${sx})`}, {transform: 'none'}], {duration: SPRINGS.morph.ms, easing: SPRINGS.morph.ease});
    th.animate([{filter: 'brightness(1.35)'}, {filter: 'none'}], {duration: SPRINGS.morph.ms * .8, easing: 'ease-out'});   // the glass "energizes" as it moves
  });
}

/* ---------------- page turns: grow out of what you tapped; slide in from the side you swiped toward */
function materialize(v, back) {
  document.dispatchEvent(new Event('turn'));   // a new page starts with the practice bar out
  if (REDUCED.matches) return;
  const recent = performance.now() - lastTap.t < 600 && lastTap.el && lastTap.el.closest && lastTap.el.closest('.home-tiles button, .home-go, .term, .cpop button');
  v.classList.remove('grow');
  if (recent) { const r = v.getBoundingClientRect(); v.style.transformOrigin = `${lastTap.x - r.left}px ${lastTap.y - r.top + ($('#page').scrollTop || 0)}px`; v.classList.add('grow'); }
  else v.style.transformOrigin = '';
}

/* ---------------- the swipe: the page follows the finger, and release velocity decides — a flick turns it, a slow
   drag past a quarter of the width turns it, anything less springs home. A new touch catches it mid-flight. */
(() => {
  const frame = $('#page'); if (!frame) return;
  let x0 = 0, y0 = 0, dx = 0, lock = null, samples = [], start = 0;
  const pg = () => $('#pg');
  const set = (x, tr) => { const p = pg(); p.style.transition = tr || 'none'; p.style.transform = x ? `translateX(${x}px)` : ''; p.style.opacity = tr || !x ? '' : String(1 - Math.min(.35, Math.abs(x) / innerWidth * .6)); };
  frame.addEventListener('touchstart', e => {
    if (e.touches.length > 1 || e.target.closest('.neckwrap,.tabwrap,.scroll,input,select,textarea,.lib')) { lock = 'no'; return; }
    const t = e.touches[0], m = new DOMMatrix(getComputedStyle(pg()).transform);   // catch a page that is still springing back
    start = m.m41; x0 = t.clientX - start; y0 = t.clientY; dx = start; lock = null; samples = [[t.clientX, performance.now()]];
    if (start) set(start);
  }, {passive: true});
  frame.addEventListener('touchmove', e => {
    if (lock === 'no') return; const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!lock) { if (Math.hypot(mx - start, my) < 10) return; lock = Math.abs(mx - start) > Math.abs(my) * 1.3 ? 'x' : 'no'; if (lock === 'no') { if (start) set(0, `transform var(--sp-snap-ms) var(--sp-snap)`); return; } }
    dx = mx; samples.push([t.clientX, performance.now()]); if (samples.length > 6) samples.shift();
    set(dx);
  }, {passive: true});
  const end = () => {
    if (lock !== 'x') { lock = null; return; } lock = null;
    const [a, b] = [samples[0], samples[samples.length - 1]], vel = b && a && b[1] > a[1] ? (b[0] - a[0]) / (b[1] - a[1]) : 0;   // px per ms
    const projected = dx + vel * 180, w = innerWidth;
    if (Math.abs(projected) > w * .25 && Math.abs(dx) > 24) {
      const dir = projected < 0 ? 1 : -1;
      set(-dir * w * .5, `transform ${SPRINGS.press.ms}ms ease-in, opacity ${SPRINGS.press.ms}ms ease-in`); pg().style.opacity = '0';
      setTimeout(() => { const p = pg(); p.style.transition = 'none'; p.style.transform = ''; p.style.opacity = ''; page(at + dir, dir < 0); }, SPRINGS.press.ms * .8);
    } else set(0, `transform var(--sp-morph-ms) var(--sp-morph), opacity var(--sp-snap-ms) var(--sp-snap)`);
  };
  frame.addEventListener('touchend', end, {passive: true}); frame.addEventListener('touchcancel', end, {passive: true});
})();

/* ---------------- the glass bars: a shadow that deepens when content scrolls under the top bar, and a highlight that follows the finger */
(() => {
  const frame = $('#page'); if (!frame) return;
  // the practice bar minimizes on a scroll down and returns on any scroll up, near the top, or at the end of the page
  let lastY = 0, travel = 0;
  const R = document.documentElement, mini = on => R.classList.toggle('mini', on);
  frame.addEventListener('scroll', () => {
    const y = frame.scrollTop, dy = y - lastY; lastY = y; R.classList.toggle('under', y > 6);
    travel = Math.sign(dy) === Math.sign(travel) ? travel + dy : dy;   // distance moved in one direction, so a jitter does not flip it
    if (y < 60 || y + frame.clientHeight > frame.scrollHeight - 4) mini(false);
    else if (travel > 24) mini(true); else if (travel < -12) mini(false);
  }, {passive: true});
  document.addEventListener('turn', () => { lastY = 0; travel = 0; mini(false); });
  const bar = $('#pbar');
  bar && bar.addEventListener('pointerdown', e => { if (R.classList.contains('mini') && !e.target.closest('button')) mini(false); });
  bar && bar.addEventListener('pointermove', e => { const r = bar.getBoundingClientRect(); bar.style.setProperty('--sx', `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`); }, {passive: true});
})();

// the book's reading order: the course up front, then the rooms, then the Index
const PAGE_ORDER = ['cover', 'learn', 'chords', 'practice', 'lab', 'double', 'sketch', 'index'];
PAGES.sort((a, b) => PAGE_ORDER.indexOf(a.id) - PAGE_ORDER.indexOf(b.id));
PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
