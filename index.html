  --p1:#3a6b55; --p2:#6f7a37; --p3:#9c3d26; --p4:#7a4a34; --p5:#3c4e6b;

}
/* Moon — the cool near-black night palette; moonlight silver/steel-blue, blackletter title */
:root[data-theme="moon"]{
  --bg:#0a0c10; --panel:#13161c; --panel2:#1b1f27; --ink:#dfe6ee; --ink2:#aab4c0; --mute:#78828f; --rule:#262c36;
  --rust:#7fa6c9; --gold:#b9c2cf; --wire:#333a46; --str:#cdd4dd; --onacc:#0a0c10; --dark:#000; --ondark:#dfe6ee;
  --p1:#6e93a8; --p2:#7f9a86; --p3:#9a8fb0; --p4:#8a97ab; --p5:#6477a0;
  --teal:#6e93a8; --sage:#7f9a86; --plum:#9a8fb0; --navy:#6477a0;
  --ok:#7f9a86; --warn:#b9c2cf; --bad:#c76b6b; --acc:#8fb3d6;
  --title:'UnifrakturMaguntia','Cinzel',serif; color-scheme:dark;
}
:root[data-theme="moon"] .brand-t{text-transform:none!important;letter-spacing:.012em!important}

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}

.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}

/* the book header */

.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}

/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}

.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}

.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}

/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}

.icon.on{background:var(--ink);color:var(--bg)}
.icon.tap{font-size:11px;font-weight:900;letter-spacing:.08em;border-color:var(--rule)}
.cta{display:flex;align-items:center;gap:12px;min-width:0}
.cta .go{background:var(--acc);color:var(--onacc);border:0;border-radius:999px;height:50px;padding:0 22px 0 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px;flex:none}
.what{display:flex;flex-direction:column;min-width:0;line-height:1.2}

.cta.none .what>span:last-child{color:var(--mute);font-weight:600}
.clock2{display:flex;align-items:center;gap:9px}

.station{display:flex;align-items:center;gap:8px;flex:none}

/* contextual "Numbers to beat" on the Practice page */
.goals-ctx{display:flex;flex-direction:column;gap:8px}
.goal-tiers{display:flex;gap:6px}
.goalchip{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:0;line-height:1.1}
.goalchip span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.goalchip b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.goalchip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.goalchip.on span{color:var(--onacc)}
.youline{font-size:13px;font-weight:700}
.pgnum{font-family:var(--display);letter-spacing:.1em;color:var(--mute);font-size:13px;white-space:nowrap;text-transform:uppercase;max-width:20ch;overflow:hidden;text-overflow:ellipsis}
.arrow{width:46px;height:46px;border:1.5px solid var(--ink);font-size:24px;font-weight:600;flex:none;color:var(--ink)}
@media (max-width:980px){ .run{display:none} .hrow h1{white-space:normal} .pgnum{display:none} }
@media (max-width:600px){ .cta .what{display:none} .cta.none .what{display:flex} .cta .go{padding:0 16px 0 14px;font-size:15px} .tempo2 .v{min-width:40px} }
/* phones, narrow (≤560px): a compact bottom bar and smaller everything so there's less to scroll */
@media (max-width:560px){
  .cta.none .what{display:none}                                  /* was the thing pushing the forward arrow off */
  .pbar .tap{display:none}                                       /* drop tap-tempo on phones; the −/+ remain */

@media (max-height:460px){

/* IX Writing: slim song-shape row under the bars, compact melody table */
.shape-row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:2px}
.shape-row .label{color:var(--rust)}
.shape-row .tl{flex:1;min-width:200px}
.cells.mel-compact{border-spacing:2px;table-layout:auto}
.cells.mel-compact td,.cells.mel-compact th{padding:3px 8px 3px 0;font-size:14px}
.prog-list{display:flex;flex-direction:column}
.prog-item{all:unset;cursor:pointer;display:block;padding:6px 6px;border-bottom:1px solid var(--rule)}
.prog-item.on{background:var(--panel)}
.prog-item:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.pl-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pl-top b{font-weight:900;font-size:15px}
.pl-top span{font-size:14px;color:var(--ink2);font-weight:700}
.pl-desc{font-size:12px;color:var(--mute);line-height:1.3;margin-top:1px}
/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */
.btn,.chip,.seg button,.icon,.arrow,.go,.thumb,.cbox,.goalchip,.rate button,.toc button,.rt li,.prog-item,.bar,.tempo2 button{transition:transform .12s cubic-bezier(.2,0,.2,1),background-color .16s ease-out,color .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out,opacity .12s ease-out}
:is(.btn,.chip,.seg button,.icon,.arrow,.thumb,.goalchip,.rate button,.toc button,.tempo2 button):active{transform:scale(.96)}
.go:active{transform:scale(.975)}
.cbox.on{transform:scale(1.03)}
.play::before{transition:border-width .14s ease-out,width .14s ease-out,height .14s ease-out}
.arrow svg{width:22px;height:22px} .tempo2 button svg{width:20px;height:20px}
.pbar .beats i{transition:transform .09s ease-out,background-color .09s ease-out}
.pbar .beats i.on{transform:scale(1.35)} .pbar .beats i.on.one{transform:scale(1.5)}
.sgrid .st{transition:background .08s ease-out,transform .08s ease-out}
.sgrid .st.now{transform:scale(1.04)}
@keyframes gm-right{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes gm-wrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.gm-right{animation:gm-right .3s ease-out} .gm-wrong{animation:gm-wrong .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes sageHop{0%{transform:translateY(0)}30%{transform:translateY(-12px)}55%{transform:translateY(0)}72%{transform:translateY(-5px)}100%{transform:translateY(0)}}

/* Theory Lab: the facts feed and the circle-of-fifths wheel */
.facts{display:flex;flex-direction:column;gap:10px}
.fact{border-left:3px solid var(--navy);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 14px}

.term{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--rust);cursor:pointer;border-bottom:1.5px dotted currentColor;line-height:1.1}
.term:hover,.term:focus-visible{opacity:.72}
#cpop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:200;padding:22px}
.cpop-card{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:16px;max-width:430px;width:100%;padding:24px 26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}

ourse":1,"fret":0,"step":-1,"acc":"","dur":1,"bar":0,"deg":"1"},{"midi":64,"name":"E","course":1,"fret":2,"step":0,"acc":"","dur":1,"bar":1,"deg":"2"},{"midi":66,"name":"F♯","course":1,"fret":4,"step":1,"acc":"♯","dur":1,"bar":1,"deg":"3"},{"midi":67,"name":"G","course":1,"fret":5,"step":2,"acc":"","dur":1,"bar":1,"deg":"4"},{"midi":71,"name":"B","course":2,"fret":2,"step":4,"acc":"","dur":1,"bar":1,"deg":"6"},{"midi":67,"name":"G","course":1,"fret":5,"step":2,"acc":"","dur":1,"bar":1,"deg":"4"},{"midi":64,"name":"E","course":1,"fret":2,"step":0,"acc":"","dur":1,"bar":1,"deg":"2"},{"midi":66,"name":"F♯","course":1,"fret":4,"step":1,"acc":"♯","dur":1,"bar":2,"deg":"3"},{"midi":67,"name":"G","course":1,"fret":5,"step":2,"acc":"","dur":1,"bar":2,"deg":"4"},{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":1,"bar":2,"deg":"5"},{"midi":74,"name":"D","course":2,"fret":5,"step":6,"acc":"","dur":1,"bar":2,"deg":"1"},{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":1,"bar":2,"deg":"5"},{"midi":66,"name":"F♯","course":1,"fret":4,"step":1,"acc":"♯","dur":1,"bar":2,"deg":"3"},{"midi":64,"name":"E","course":1,"fret":2,"step":0,"acc":"","dur":2,"bar":3,"deg":"2"},{"midi":62,"name":"D","course":1,"fret":0,"step":-1,"acc":"","dur":1,"bar":3,"deg":"1"},{"midi":62,"name":"D","course":1,"fret":0,"step":-1,"acc":"","dur":3,"bar":3,"deg":"1"}],"chords":["I","I","I","V"],"bars":4,"beats":6,"blurb":"DUD DUD: the down lands on each big beat","tradition":"celtic"},{"id":"mixophrase","name":"A Mixolydian phrase (Old Joe Clark shape)","key":"A","meter":"4/4","scale":"mixo","notes":[{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":1,"bar":0,"deg":"1"},{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":0.5,"bar":0,"deg":"1"},{"midi":71,"name":"B","course":2,"fret":2,"step":4,"acc":"","dur":0.5,"bar":0,"deg":"2"},{"midi":73,"name":"C♯","course":2,"fret":4,"step":5,"acc":"♯","dur":1,"bar":0,"deg":"3"},{"midi":73,"name":"C♯","course":2,"fret":4,"step":5,"acc":"♯","dur":1,"bar":0,"deg":"3"},{"midi":71,"name":"B","course":2,"fret":2,"step":4,"acc":"","dur":1,"bar":1,"deg":"2"},{"midi":73,"name":"C♯","course":2,"fret":4,"step":5,"acc":"♯","dur":1,"bar":1,"deg":"3"},{"midi":74,"name":"D","course":2,"fret":5,"step":6,"acc":"","dur":1,"bar":1,"deg":"4"},{"midi":73,"name":"C♯","course":2,"fret":4,"step":5,"acc":"♯","dur":1,"bar":1,"deg":"3"},{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":1,"bar":2,"deg":"1"},{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":0.5,"bar":2,"deg":"1"},{"midi":71,"name":"B","course":2,"fret":2,"step":4,"acc":"","dur":0.5,"bar":2,"deg":"2"},{"midi":73,"name":"C♯","course":2,"fret":4,"step":5,"acc":"♯","dur":1,"bar":2,"deg":"3"},{"midi":73,"name":"C♯","course":2,"fret":4,"step":5,"acc":"♯","dur":1,"bar":2,"deg":"3"},{"midi":79,"name":"G","course":3,"fret":3,"step":9,"acc":"","dur":1,"bar":3,"deg":"♭7"},{"midi":79,"name":"G","course":3,"fret":3,"step":9,"acc":"","dur":1,"bar":3,"deg":"♭7"},{"midi":69,"name":"A","course":2,"fret":0,"step":3,"acc":"","dur":2,"bar":3,"deg":"1"}],"chords":["I","I","I","♭VII"],"bars":4,"beats":4,"blurb":"the flat seventh (G natural in A) is the whole old-time sound; the chord under it is G, the ♭VII","tradition":"old-time"}],"concepts":[{"id":"course","term":"Course","short":"A pair of strings tuned in unison and played as one. The mandolin has four courses, eight strings.","more":"The doubled strings are why the mandolin shimmers and why tremolo works: two strings never ring exactly alike.","see":["tuning","unison","tremolo"]},{"id":"tuning","term":"Tuning (G D A E)","short":"The four courses, low to high: G3 D4 A4 E5 — perfect fifths, the same as a violin.","more":"Because every neighbouring course is the same distance apart, one shape works on any pair of courses and slides to any key.","see":["fifth","symmetry","course"]},{"id":"fifth","term":"Perfect fifth","short":"Seven half steps. The interval between every pair of adjacent courses, and the same fret on the next course up.","more":"Fret 7 on any course is the next course open: that is the landmark the whole neck hangs on.","see":["tuning","interval","symmetry"]},{"id":"symmetry","term":"Fifths symmetry","short":"The mandolin’s superpower: with every course a fifth apart, a scale or chord shape is the same on any pair of courses and in every key once it has no open string.","more":"A guitar’s third between B and G breaks its shapes; the mandolin has no such break. Learn one closed shape and you own it everywhere.","see":["tuning","ffcp","chop-chord"]},{"id":"fret","term":"Fret","short":"The metal bars across the neck; pressing just behind one shortens the string by one half step per fret.","more":"Fret 12 is the octave of the open course. The dots usually mark 3 5 7 10 12 15.","see":["half-step","octave","landmark"]},{"id":"landmark","term":"Landmarks","short":"Frets you can find without counting: 5, 7 and 12. Fret 7 is the next course open; fret 12 is the octave; fret 5 is a fourth.","more":"","see":["fret","fifth","octave"]},{"id":"nut","term":"Nut","short":"The slotted bar at the top of the neck the open strings pass over; fret 0.","more":"","see":["fret","bridge"]},{"id":"bridge","term":"Bridge","short":"The floating wooden piece on the top that the strings cross, held down by string tension alone. Moving it changes intonation.","more":"If fret 12 does not match the harmonic at fret 12, the bridge has crept.","see":["nut","tailpiece","intonation"]},{"id":"tailpiece","term":"Tailpiece","short":"The metal piece at the bottom the strings hook into. Mandolin strings have loop ends, not ball ends.","more":"","see":["bridge"]},{"id":"f-hole","term":"F-holes and the oval hole","short":"F-style and many A-style mandolins have two f-holes like a violin; others have a single oval hole, which sounds rounder and quieter.","more":"","see":["a-style","f-style"]},{"id":"a-style","term":"A-style","short":"The teardrop-bodied mandolin. Same neck, same tuning, usually less money than an F-style; the sound difference is small.","more":"","see":["f-style","f-hole"]},{"id":"f-style","term":"F-style","short":"Gibson’s 1920s design with the scroll and points. The bluegrass look. The scroll is decoration; the f-holes and carved top are the sound.","more":"","see":["a-style","f-hole"]},{"id":"intonation","term":"Intonation","short":"Whether a fretted note is in tune with the open string. Set by where the bridge sits.","more":"Compare the fretted note at 12 with the harmonic at 12: sharp means the bridge is too far forward.","see":["bridge","tuner"]},{"id":"tuner","term":"Tuner","short":"The book’s Fretboard Lab listens through the microphone and shows how far each course is from G D A E.","more":"","see":["tuning","intonation"]},{"id":"pick","term":"Pick (plectrum)","short":"The mandolin is played with a pick, usually a thick, rounded one. Thin picks click; thick ones give the chop its bark.","more":"","see":["downstroke","upstroke","alternate-picking"]},{"id":"downstroke","term":"Downstroke (⊓)","short":"The pick moving down toward the floor — the strong stroke. It lands on the beat.","more":"","see":["upstroke","alternate-picking","pick"]},{"id":"upstroke","term":"Upstroke (V)","short":"The pick moving up — the light stroke, on the “and”.","more":"","see":["downstroke","alternate-picking"]},{"id":"alternate-picking","term":"Alternate picking","short":"Down-up-down-up without exception, the pick moving like a clock whether it hits a string or not. Downs on the beats.","more":"Keep the alternation even when the next note is on another course; that is what makes a reel sit in the groove.","see":["downstroke","upstroke","jig-picking"]},{"id":"jig-picking","term":"Jig picking (DUD DUD)","short":"In 6/8 the pattern is down-up-down, down-up-down, so a downstroke falls on each of the two big beats.","more":"Two downstrokes in a row is the whole trick: the hand resets on every big beat.","see":["alternate-picking","jig"]},{"id":"rest-stroke","term":"Rest stroke","short":"A downstroke that lands and rests on the next course instead of flying past — the Monroe downstroke, louder and darker.","more":"","see":["downstroke"]},{"id":"chop-chord","term":"Chop chord","short":"A closed four-finger chord with no open string, so it can be muted the instant it is struck and moved to any key.","more":"Three grips (the D-shape, F-shape and C-shape) cover the whole neck; the D-shape alone plays rhythm in every bluegrass key.","see":["chop","symmetry","closed-position"]},{"id":"chop","term":"The chop","short":"The bluegrass backbeat: a short, muted downstroke on beats 2 and 4. The mandolin is the band’s snare drum.","more":"Strike and release the fretting pressure in the same instant so the chord barks and dies. The fretting hand never leaves the strings.","see":["chop-chord","backbeat","downstroke"]},{"id":"backbeat","term":"Backbeat","short":"Beats 2 and 4 in 4/4 — where the chop lands and where the audience claps.","more":"","see":["chop","beat"]},{"id":"open-chord","term":"Open chord","short":"A chord using open courses, near the nut: G C D A E and their minors. The folk shapes.","more":"","see":["chop-chord","two-finger-chord"]},{"id":"two-finger-chord","term":"Two-finger chord","short":"G, C, D, Em and Dm each need only two fingers. The gateway to playing songs tonight.","more":"","see":["open-chord"]},{"id":"closed-position","term":"Closed position","short":"A hand position with no open strings — so everything under it moves with the hand.","more":"","see":["ffcp","chop-chord","symmetry"]},{"id":"ffcp","term":"FFcP (four-finger closed position)","short":"A system for scales: index, middle, ring and pinky each own a pair of frets, and the root sits under one of them. Four shapes, every key.","more":"One octave is two courses; the shape on courses 1–2 is the same on 2–3 and 3–4. Slide it and the key changes; nothing else does.","see":["closed-position","symmetry","scale"]},{"id":"first-position","term":"First position","short":"The hand near the nut: index around fret 2, pinky reaching fret 7. Open strings ring; most fiddle tunes live here.","more":"","see":["closed-position","open-chord"]},{"id":"double-stop","term":"Double stop","short":"Two notes at once on adjacent courses — the fiddle’s harmony, borrowed whole. Thirds and sixths above all.","more":"A third above sits three or four frets behind on the next course; a sixth sits one or two frets ahead. The quality changes as you move because the notes come from the key.","see":["third","sixth","harmony"]},{"id":"drone","term":"Drone","short":"An open course ringing under a melody on the next course. The old-time and Celtic sound; free on a fifths-tuned instrument.","more":"","see":["double-stop","open-chord","fifth"]},{"id":"tremolo","term":"Tremolo","short":"Rapid, even down-up strokes on one note so it sustains. The mandolin’s singing voice, and a measured subdivision before it is a blur.","more":"Start with four strokes a beat at the practice bar’s tempo, then six, then eight. Even first; fast later.","see":["course","alternate-picking","subdivision"]},{"id":"subdivision","term":"Subdivision","short":"How many strokes fit in one beat: two (eighths), three (triplets), four (sixteenths). Tremolo is a subdivision you stop counting.","more":"","see":["tremolo","beat"]},{"id":"kickoff","term":"Kickoff","short":"The instrumental intro that sets the tempo and key before the singing: on the mandolin, often four potatoes or the last line of the tune.","more":"","see":["potatoes","tag"]},{"id":"potatoes","term":"Potatoes","short":"The fiddler’s count-in: a long-short-short shuffle on a root-and-fifth double stop, four times. The mandolin borrowed it.","more":"","see":["kickoff","double-stop"]},{"id":"tag","term":"Tag","short":"A short ending phrase after the last chorus — “shave and a haircut” and its cousins.","more":"","see":["kickoff"]},{"id":"break","term":"Break","short":"A solo over one time through the song. In bluegrass the mandolin break usually comes right after the first chorus.","more":"","see":["kickoff","chop"]},{"id":"hammer-on","term":"Hammer-on and pull-off","short":"Sounding a note with the fretting finger alone: hammer onto a higher fret, or pull off to a lower one. Rolls and triplets live on these.","more":"","see":["slide","ornament"]},{"id":"slide","term":"Slide","short":"Fretting a note and sliding the finger to another fret while it rings. The bluesy entrance to a note, Monroe-style.","more":"","see":["hammer-on","ornament"]},{"id":"ornament","term":"Ornament","short":"A small decoration on a melody note: a roll, a cut, a triplet, a slide. Celtic playing is made of them.","more":"","see":["hammer-on","slide","triplet"]},{"id":"triplet","term":"Triplet","short":"Three notes in the time of two — the Irish ornament and the swing feel both start here.","more":"","see":["ornament","subdivision"]},{"id":"note","term":"Note","short":"A single pitch, named with the letters A to G.","more":"","see":["half-step","octave"]},{"id":"half-step","term":"Half step","short":"One fret. The smallest move in Western music; twelve of them make an octave.","more":"E to F and B to C are half steps; everywhere else a sharp or flat sits between the letters.","see":["whole-step","fret"]},{"id":"whole-step","term":"Whole step","short":"Two frets.","more":"The major scale is whole steps with two half steps in it: W W H W W W H.","see":["half-step","major-scale"]},{"id":"octave","term":"Octave","short":"The same note higher: twelve frets, or the next course five frets up, or two courses up and two frets back.","more":"","see":["note","fret","interval"]},{"id":"unison","term":"Unison","short":"Two strings on the same note. Each course is a unison pair; fret 7 on one course is a unison with the next course open.","more":"","see":["course","fifth"]},{"id":"sharp","term":"Sharp (♯)","short":"One half step higher — one fret up. Sharps arrive in the order F C G D A E B.","more":"","see":["flat","key-signature"]},{"id":"flat","term":"Flat (♭)","short":"One half step lower — one fret down. Flats arrive B E A D G C F.","more":"","see":["sharp","key-signature"]},{"id":"interval","term":"Interval","short":"The distance between two notes, counted in letters and measured in frets. On the mandolin every interval is a shape.","more":"A fifth is the same fret on the next course; an octave is five frets up on the next course; a third is three or four frets back.","see":["fifth","third","sixth","octave"]},{"id":"third","term":"Third","short":"Two letters up. Major (4 frets) is bright, minor (3) is soft. The note that gives a chord its mood, and the first harmony everyone finds.","more":"","see":["interval","double-stop","major-chord","minor-chord"]},{"id":"sixth","term":"Sixth","short":"Five letters up: a third below, lifted an octave. On adjacent courses it is the easiest double stop — one or two frets ahead.","more":"","see":["third","double-stop"]},{"id":"scale","term":"Scale","short":"A home note and its family, in order. A tune draws its notes from one.","more":"","see":["major-scale","mode","pentatonic","ffcp"]},{"id":"major-scale","term":"Major scale","short":"W W H W W W H: do re mi. The scale of G, D and A, the keys bluegrass lives in.","more":"","see":["scale","key","whole-step"]},{"id":"minor-scale","term":"Minor scale","short":"The darker cousin: ♭3 ♭6 ♭7. Natural minor is the major scale started from its 6th note.","more":"Most “minor” fiddle tunes are really Dorian — a bright 6th.","see":["scale","relative-minor","dorian"]},{"id":"pentatonic","term":"Pentatonic","short":"Five notes, no half steps. The major pentatonic is a Monroe break; the minor pentatonic is the blues.","more":"","see":["scale","blues-scale"]},{"id":"blues-scale","term":"Blues scale","short":"Minor pentatonic with the ♭5 added — the blue note between 4 and 5. Bluegrass bends it inside major keys.","more":"","see":["pentatonic","scale"]},{"id":"mode","term":"Mode","short":"The major scale started on a different note: same notes, different home. Fiddle tunes use two of them constantly.","more":"","see":["mixolydian","dorian","major-scale"]},{"id":"mixolydian","term":"Mixolydian","short":"Major with a flat 7th. Old Joe Clark, Red Haired Boy, most “modal” old-time tunes. The ♭VII chord lives here.","more":"","see":["mode","dorian"]},{"id":"dorian","term":"Dorian","short":"Minor with a bright 6th. Shady Grove, Cooley’s Reel, nearly every Irish tune called “minor”.","more":"","see":["mode","minor-scale","mixolydian"]},{"id":"key","term":"Key","short":"The home note of a tune plus its scale. Bluegrass favours G, A, B, B♭ and D; Irish sessions D, G, A, E minor and A Dorian.","more":"A singer’s key is whatever fits the voice; the mandolin follows with closed chords instead of a capo.","see":["key-signature","circle-of-fifths","tonic"]},{"id":"key-signature","term":"Key signature","short":"The sharps or flats at the start of the staff that belong to the key. One sharp is G, two is D, three is A.","more":"","see":["key","sharp","flat"]},{"id":"tonic","term":"Tonic","short":"The home note of a key — where a tune comes to rest.","more":"","see":["key","scale"]},{"id":"circle-of-fifths","term":"Circle of fifths","short":"The twelve keys in a ring, each a fifth up from the last, each adding a sharp. On the mandolin the ring is the neck: G D A E are four steps of it.","more":"A key’s V is one step clockwise, its IV one step back. The three touching keys give the three chords most tunes use.","see":["key","fifth","relative-minor"]},{"id":"relative-minor","term":"Relative minor","short":"The minor key sharing a major key’s notes, a minor third below: E minor for G, B minor for D.","more":"","see":["minor-scale","key"]},{"id":"root","term":"Root","short":"The note a chord is named after and built up from.","more":"","see":["chord","triad"]},{"id":"chord","term":"Chord","short":"Three or more notes sounding together. On the mandolin usually four courses, so one note is doubled.","more":"","see":["triad","root","open-chord","chop-chord"]},{"id":"triad","term":"Triad","short":"The basic three-note chord: root, third, fifth.","more":"","see":["chord","third","fifth"]},{"id":"major-chord","term":"Major chord","short":"A triad with a major third — bright. G, C, D, A.","more":"","see":["triad","third","minor-chord"]},{"id":"minor-chord","term":"Minor chord","short":"A triad with a minor third — darker. One fret separates it from major: drop the third one fret.","more":"","see":["triad","third","major-chord"]},{"id":"seventh-chord","term":"Seventh chord","short":"A triad with a flat seventh on top. The V7 (D7 in G) pulls hard back home.","more":"","see":["triad","cadence"]},{"id":"roman-numerals","term":"Roman numerals","short":"Chords named by their place in the key: I IV V major, ii iii vi minor, vii° diminished. A progression written this way works in any key.","more":"","see":["progression","key"]},{"id":"progression","term":"Progression","short":"The sequence of chords under a tune. I IV V is most of bluegrass; I and ♭VII is most of Old Joe Clark.","more":"","see":["roman-numerals","cadence"]},{"id":"cadence","term":"Cadence","short":"How a phrase lands: V to I is finished; ending on V hangs. The last two bars of every fiddle-tune part are a cadence.","more":"","see":["progression","seventh-chord"]},{"id":"chord-tone","term":"Chord tone","short":"A note that belongs to the chord underneath — root, third or fifth. The safe notes for a harmony or a break.","more":"","see":["chord","double-stop","harmony"]},{"id":"harmony","term":"Harmony","short":"A second line that agrees with the melody — on the mandolin, a double stop a third or sixth away.","more":"","see":["double-stop","third","sixth","chord-tone"]},{"id":"beat","term":"Beat","short":"The steady pulse you tap your foot to. Downstrokes land on it.","more":"","see":["backbeat","tempo","time-signature"]},{"id":"tempo","term":"Tempo (BPM)","short":"How fast the beat goes, in beats per minute. The practice bar sets it; the metronome keeps it.","more":"","see":["beat"]},{"id":"time-signature","term":"Time signature","short":"Beats per bar and which note gets a beat: 4/4 reels, 6/8 jigs, 3/4 waltzes, 2/4 breakdowns.","more":"","see":["beat","jig","reel"]},{"id":"reel","term":"Reel","short":"A dance tune in 4/4: straight eighths, a lean on 1 and 3, played with alternate picking.","more":"","see":["time-signature","jig","hornpipe"]},{"id":"jig","term":"Jig","short":"A dance tune in 6/8: two big beats of three. Picked DUD DUD.","more":"","see":["jig-picking","reel","time-signature"]},{"id":"hornpipe","term":"Hornpipe","short":"A 4/4 tune played dotted — long-short — with a swagger.","more":"","see":["reel","jig"]},{"id":"aabb","term":"AABB form","short":"Almost every fiddle tune: an 8-bar A part twice, an 8-bar B part twice, 32 bars a time through.","more":"","see":["reel","jig"]},{"id":"staff","term":"The staff","short":"Five lines music is written on. The mandolin reads the treble clef: lines E G B D F, spaces F A C E, the open G below on a ledger line.","more":"","see":["clef","tab"]},{"id":"clef","term":"Clef","short":"The sign at the start of the staff. Mandolin music uses the treble clef (𝄞), like the violin.","more":"","see":["staff"]},{"id":"tab","term":"Tab (tablature)","short":"Four lines, one per course, the E course on top; a number is the fret to play. Says where, not how long — read the rhythm from the staff above it.","more":"","see":["staff","fret"]},{"id":"ledger-line","term":"Ledger line","short":"A short extra line for notes above or below the staff. The open G course sits two ledger lines below the treble staff.","more":"","see":["staff"]}],"aliases":{"courses":"course","strings":"course","string pair":"course","tuned in fifths":"tuning","fifths":"fifth","perfect fifth":"fifth","frets":"fret","fretboard":"fret","neck":"fret","landmarks":"landmark","f-holes":"f-hole","oval hole":"f-hole","a-style":"a-style","f-style":"f-style","plectrum":"pick","picks":"pick","downstrokes":"downstroke","upstrokes":"upstroke","alternate pick":"alternate-picking","down-up":"alternate-picking","dud dud":"jig-picking","rest strokes":"rest-stroke","chop chords":"chop-chord","chop chord":"chop-chord","chopping":"chop","chops":"chop","open chords":"open-chord","two-finger chords":"two-finger-chord","two-finger":"two-finger-chord","closed":"closed-position","four-finger closed position":"ffcp","first position":"first-position","double stops":"double-stop","double-stops":"double-stop","drones":"drone","tremolos":"tremolo","subdivisions":"subdivision","kickoffs":"kickoff","tags":"tag","breaks":"break","hammer-ons":"hammer-on","pull-off":"hammer-on","pull-offs":"hammer-on","slides":"slide","ornaments":"ornament","rolls":"ornament","roll":"ornament","triplets":"triplet","notes":"note","half steps":"half-step","semitone":"half-step","semitones":"half-step","whole steps":"whole-step","octaves":"octave","sharps":"sharp","flats":"flat","intervals":"interval","thirds":"third","major third":"third","minor third":"third","sixths":"sixth","scales":"scale","major scale":"major-scale","minor scale":"minor-scale","pentatonics":"pentatonic","blues scale":"blues-scale","modes":"mode","keys":"key","key signature":"key-signature","key signatures":"key-signature","circle of fifths":"circle-of-fifths","relative minor":"relative-minor","chords":"chord","triads":"triad","major chord":"major-chord","minor chord":"minor-chord","seventh chord":"seventh-chord","seventh chords":"seventh-chord","roman numerals":"roman-numerals","progressions":"progression","cadences":"cadence","chord tone":"chord-tone","chord tones":"chord-tone","harmonies":"harmony","beats":"beat","bpm":"tempo","time signatures":"time-signature","reels":"reel","jigs":"jig","hornpipes":"hornpipe","treble clef":"clef","tablature":"tab","ledger lines":"ledger-line","the chop":"chop","root note":"root"},"theory":{"facts":[{"t":"Eight strings, four notes","b":"The mandolin has eight strings in four pairs. Each pair is tuned to one note and played as one: that is a course. The doubling is why it shimmers.","tag":"instrument"},{"t":"Tuned like a violin","b":"G D A E, low to high, every course a perfect fifth above the last. A violinist can pick one up and play; a guitarist has to unlearn the fourths.","tag":"instrument"},{"t":"A-style, F-style","b":"The teardrop A and the scrolled F have the same neck and tuning. The scroll is a 1920s ornament; the carved top and the f-holes are the sound. Buy the one that sounds good.","tag":"instrument"},{"t":"The bridge floats","b":"Nothing holds the bridge but string tension. If fretted notes go sharp or flat up the neck, it has crept: match fret 12 to the harmonic at 12 and move it.","tag":"instrument"},{"t":"Thick pick, loose wrist","b":"A thick, rounded pick gives the chop its bark and the tremolo its smoothness. The motion comes from the wrist, not the arm, and the pick barely enters the strings.","tag":"instrument"},{"t":"Fret 7 is the next string","b":"Press any course at fret 7 and you have the next course open. Every scale, chord and double stop on the instrument follows from that one fact.","tag":"neck"},{"t":"The octave is a shape","b":"Up a course and five frets, or up two courses and back two frets. Both are an octave; the second keeps the hand in one place.","tag":"neck"},{"t":"One shape, every key","b":"A closed shape has no open string, so sliding it two frets moves the key up a whole step and changes nothing else. On a guitar the B string breaks this; on the mandolin nothing does.","tag":"neck"},{"t":"Thirds behind, sixths ahead","b":"A third above sits three or four frets behind on the next course; a sixth above sits one or two frets ahead. Which one depends on where you are in the key — the ear fixes it before the hand does.","tag":"neck"},{"t":"Fewest fingers first","b":"G, C, D, Em and Dm need two fingers each. With those five you can play along with most of the songs at a jam tonight; the four-finger shapes can wait.","tag":"chords"},{"t":"The chop is the drummer","b":"In a bluegrass band there is no drum kit. The mandolin chop on 2 and 4 — a muted bark, not a ringing chord — is the backbeat the whole band leans on.","tag":"chords"},{"t":"Why chop chords have no open string","b":"A chord with an open course cannot be muted by relaxing the fretting hand, and it cannot be moved. Closed grips give you both: the bark and every key.","tag":"chords"},{"t":"Three grips cover the neck","b":"The D-shape, F-shape and C-shape chop chords each put the root under a different finger. Learn the D-shape first: one grip, every key, by counting frets.","tag":"chords"},{"t":"Drop the third one fret","b":"A major chord becomes minor by lowering its third one fret. A becomes Am, D becomes Dm, the chop chord becomes the minor chop. One finger moves.","tag":"chords"},{"t":"Four fingers, two frets each","b":"FFcP: index owns the first two frets of the position, middle the next two, ring the next, pinky the last two. The hand never shifts inside a position; it only slides between them.","tag":"scales"},{"t":"Two courses make an octave","b":"Degrees 1 to 4 on one course are the same frets as 5 to 8 on the next. That is the major scale on the mandolin: one four-fret pattern, twice.","tag":"scales"},{"t":"The fiddle’s two modes","b":"Old-time and Celtic tunes live in Mixolydian (major with a ♭7 — Old Joe Clark) and Dorian (minor with a bright 6 — Shady Grove). If a tune sounds major but never resolves, it is Mixolydian.","tag":"scales"},{"t":"The pentatonic break","b":"Drop the 4th and 7th and nothing clashes: five safe notes, the shape of most bluegrass fills. Add the ♭3 as a passing note and it turns blue.","tag":"scales"},{"t":"G D A E are four steps of the circle","b":"The courses walk the circle of fifths. One course up is one sharp more; the key of the next course is the V of the one below.","tag":"keys"},{"t":"Bluegrass keys","b":"G, A, B♭, B and D, chosen for the singer. The guitar capos; the mandolin slides its closed chords instead. B♭ is just the A chop one fret up.","tag":"keys"},{"t":"Session keys","b":"Irish and Scottish sessions live in D, G, A, E minor, A Dorian and B minor — the keys where the open courses drone under the tune.","tag":"keys"},{"t":"Chords in a key","b":"Build a triad on each note of the major scale and the pattern is always major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°.","tag":"keys"},{"t":"Why a third","b":"Play the tune note on one course and the note two letters up on the next course, three or four frets back. That is the third above, and it is a chord tone of nearly every chord the melody is on.","tag":"harmony"},{"t":"Why the shape keeps changing","b":"A third above G is B — four frets, major. A third above A is C — three frets, minor. The hand moves one fret because every harmony note comes from the key.","tag":"harmony"},{"t":"Sixths are thirds turned over","b":"A third below, lifted an octave, is a sixth above. On adjacent courses the sixth is the easier reach: one or two frets ahead instead of three or four behind.","tag":"harmony"},{"t":"The drone is free","b":"Any open course under a melody on the course above is a fifth below it — the old-time and Celtic drone. It costs nothing on a fifths-tuned instrument.","tag":"harmony"},{"t":"Tremolo is a subdivision","b":"The mandolin cannot sustain, so a long note is many short ones. Start measured — four strokes a beat — and only after it is even let it blur into eight.","tag":"rhythm"},{"t":"Down on the beat","b":"Alternate picking puts every downstroke on a beat and every upstroke on an “and”, whatever course the note is on. The groove comes from never breaking that.","tag":"rhythm"},{"t":"Jigs reset every three","b":"In 6/8 the pattern is down-up-down, down-up-down. Two downs in a row at the join is not a mistake; it is what keeps the big beats heavy.","tag":"rhythm"},{"t":"Potatoes","b":"A fiddler counts the band in with four shuffle strokes on a root-and-fifth double stop — “ta-ters, ta-ters, ta-ters, ta-ters”. The mandolin plays the same kickoff.","tag":"rhythm"},{"t":"Monroe and the chop","b":"Bill Monroe built bluegrass around the mandolin: the chop as the band’s backbeat, the downstroke-heavy break, blues notes inside major keys. Most bluegrass mandolin descends from his 1940s records.","tag":"rhythm"},{"t":"The Celtic tremolo","b":"In Irish and Italian playing the tremolo is the voice, used on long notes and airs rather than as rhythm. The same strokes, a different job.","tag":"rhythm"},{"t":"Tab says where, the staff says when","b":"Four tab lines, the E course on top, numbers for frets. Tab has no rhythm of its own; read the note lengths from the staff above it.","tag":"reading"},{"t":"The open G is below the staff","b":"The mandolin reads the treble clef. The open G course sits two ledger lines under it; the open E course is the top space. The whole first position fits between.","tag":"reading"},{"t":"AABB","b":"Almost every fiddle tune is an 8-bar A part played twice and an 8-bar B part played twice. Learn the A part, and you already know a quarter of the tune.","tag":"reading"},{"t":"Reels, jigs, hornpipes","b":"A reel is 4/4 in straight eighths; a jig is 6/8 in two beats of three; a hornpipe is 4/4 played dotted. The time signature tells your pick hand which pattern to use.","tag":"reading"}]}};

// the Learn map, Duolingo-style: 5 module sections, each a banner + a winding column of lesson nodes; the wizard marks where you are
// Build a chapter quiz: mostly the chapter's topic, with a few review questions woven in from the previous chapter.
function buildQuiz(primary, review, n) {
  const out = [], seen = new Set(); let g = 0;
  while (out.length < n && g++ < 1500) {
    const useReview = review.length && out.length >= 3 && Math.random() < 0.2;
    const pool = useReview ? review : primary, tp = pool[rnd(pool.length)], facs = QBANK[tp];
    if (!facs || !facs.length) continue;
    const Q = facs[rnd(facs.length)]();
    if (!Q || seen.has(Q.q)) continue; seen.add(Q.q); if (useReview) Q.review = true; out.push(Q);
  }
  return shuffle(out);
}

/* ---------------------------------------------------------------- the mandolin pages */
/* ================================================================ MANDOLIN MASTERY: helpers shared by the pages
   Every note here is looked up in D (computed and asserted by export_mandolin.py); nothing musical is typed by hand. */
const KEYS = D.keys, MAJ = [0, 2, 4, 5, 7, 9, 11], OPENM = D.openMidi, COURSES = D.courses, NFR = D.frets;
const midiName = m => SH[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const midiAt = (c, f) => OPENM[c] + f;
const noteAt = (c, f) => D.board[c][f];
const courseLabel = c => `${['4th', '3rd', '2nd', '1st'][c]} (${COURSES[c]})`;
const shapeMidis = sh => sh.frets.map((f, c) => f >= 0 ? midiAt(c, f) : null).filter(x => x != null);
const SCALE_BY = Object.fromEntries(D.scales.map(s => [s.id, s]));
const PICK_BY = Object.fromEntries(D.pick.map(p => [p.id, p]));
const IVN = Object.fromEntries(D.intervals.map(x => [x[0], x]));
const keyPcs = (k, sid = 'major') => SCALE_BY[sid].steps.map(st => (pcof(k) + st) % 12);
const keyNoteName = (k, pc) => (D.keyScales[k] || []).find(n => pcof(n) === pc) || SH[pc];

/* ---------------------------------------------------------------- a mandolin course: two unison strings struck ~9 ms apart, one a few cents off, so the pair shimmers */
function course(midi, t, {gain = .3, kind = 'ring', dur, c = -1} = {}) {
  const a = playMidi(midi, t, {gain: gain * .72, kind, dur, string: c >= 0 ? c * 2 : -1});
  const b = playMidi(midi, t + .009, {gain: gain * .55, kind, dur, string: c >= 0 ? c * 2 + 1 : -1});
  try { b.detune.value = 7; } catch (e) {}
  return a;
}
// one stroke across a chord: D down (low to high), U up (high to low, lighter), X the chop (muted, short), B the bass course alone
function mstrum(shape, kind, t) {
  const fr = shape.frets, idx = fr.map((f, c) => f >= 0 ? c : -1).filter(c => c >= 0);
  if (kind === 'B') { const c = idx[0]; course(midiAt(c, fr[c]), t, {gain: .42, c}); return; }
  const order = kind === 'U' ? idx.slice().reverse() : idx, gap = kind === 'X' ? .005 : .012;
  order.forEach((c, i) => course(midiAt(c, fr[c]), t + i * gap, {gain: kind === 'X' ? .36 : kind === 'U' ? .2 : .28, kind: kind === 'X' ? 'mute' : 'ring', c}));
}
const hearChord = (shape, kind = 'D') => { audio(); mstrum(shape, kind, A.ctx.currentTime + .02); };
const hearNote = (m, gain = .42) => { audio(); course(m, A.ctx.currentTime + .02, {gain}); };
const hearNotes = (ms, gap = .42, gain = .36) => { audio(); const t = A.ctx.currentTime + .02; ms.forEach((m, i) => course(m, t + i * gap, {gain})); };
const hearTogether = (ms, gain = .3) => { audio(); const t = A.ctx.currentTime + .02; ms.forEach((m, i) => course(m, t + i * .01, {gain})); };
const hearPair = (a, b, gap = .55) => hearNotes([a, b], gap);
// a pick pattern over a chord, looped on the practice bar: a click on every beat underneath so the chop has something to answer
function patternPlayer(p, shape, {onStep = () => {}, extra = null} = {}) {
  return (bpm, onStop, onBeat) => { const b = 60 / bpm, unit = p.unit === 8 ? b / 3 : b / p.sub, ev = [];
    const chars = p.pat.split(''), beatsPerBar = p.unit === 8 ? p.beats / 3 : p.beats;
    chars.forEach((ch, i) => { const at = i * unit, beat = Math.floor(at / b + 1e-6);
      ev.push({at, fn: t => { if (Math.abs(at / b - Math.round(at / b)) < 1e-6) click(t, Math.round(at / b) % beatsPerBar === 0);
        if (ch === 'D' || ch === 'U' || ch === 'X' || ch === 'B') (extra || mstrum)(shape, ch, t); }, ui: () => { onStep(i); onBeat(beat); }}); });
    Seq.run(ev, chars.length * unit, () => { onStep(-1); onStop(); }); };
}
// tremolo: `sub` alternating strokes a beat on one note (or a double stop), four beats, looped
function tremoloPlayer(ms, sub, {onStep = () => {}} = {}) {
  return (bpm, onStop, onBeat) => { const b = 60 / bpm, ev = [];
    for (let k = 0; k < 4 * sub; k++) { const at = k * b / sub, beat = Math.floor(k / sub);
      ev.push({at, fn: t => { if (k % sub === 0) click(t, k === 0); ms.forEach((m, i) => course(m, t + i * .008, {gain: k % 2 ? .22 : .3, kind: 'note', dur: b / sub * .95, c: i})); }, ui: () => { onStep(k); onBeat(beat); }}); }
    Seq.run(ev, 4 * b, () => { onStep(-1); onStop(); }); };
}
// a run of notes (a scale, a tune): one note per `div` of a beat, up and back if `back`
function runPlayer(ms, {div = 2, back = true, onStep = () => {}, chord = null} = {}) {
  return (bpm, onStop, onBeat) => { const b = 60 / bpm, ev = []; let at = 0;

    Q('Most bluegrass songs use:', 'I, IV and V — three chords', ['every chord in the key', 'only minor chords', 'ii–V–I'], 'The three-chord song.', 'Three chords cover most of the bluegrass and old-time songbook: in G, that is G, C and D, with the chop under all of it.'),

    Q('Why does a pentatonic break “never hit a wrong note”?', 'none of its notes is a half step from a chord tone, so nothing clashes', ['because it has more notes', 'because it uses open strings', 'because it is played fast'], 'No half steps.', 'The major pentatonic has no half steps and no 4th or 7th, the two notes that rub against I and V chords. Every note is safe over the three chords.'),

    Q('Old Joe Clark and Red Haired Boy are in:', 'Mixolydian', ['Dorian', 'natural minor', 'harmonic minor'], 'Major with a flat seventh.', 'Both are A Mixolydian: the G natural (♭7) against the A chord is the whole flavour, and the second chord is G, the ♭VII.'),

    Q('On the mandolin, a third above the melody note sits:', 'on the next course up, three or four frets behind', ['on the same course, three frets up', 'on the next course, the same fret', 'two courses up'], 'Behind, not ahead.', 'A third is 3 or 4 half steps; the next course is already 7 up, so the harmony finger sits 3 or 4 frets back. Major = 3 back, minor = 4 back.'),

  timesigs: [
    () => { const t = _TT[rnd(_TT.length)]; return {q: `A ${t.name.toLowerCase()} is in:`, a: t.meter, opts: strOpts(t.meter, _TT.map(x => x.meter)), hint: t.feel + '.', why: `${t.name}: ${t.meter} — ${t.feel}. Pick it ${PICK_BY[t.pick].name.toLowerCase()}.`}; },
    Q('6/8 means:', 'six eighth notes a bar, felt as two big beats of three', ['six quarter notes a bar', 'eight bars of six', 'six beats, all equal'], 'ONE-two-three FOUR-five-six.', 'A jig: two big beats, each divided in three. The pick goes down-up-down, down-up-down, so each big beat gets a down.'),
    Q('The top number of a time signature is:', 'how many beats in a bar', ['which note gets a beat', 'the tempo', 'the key'], 'Count.', 'Top: beats per bar. Bottom: which note value is the beat — 4 for a quarter, 8 for an eighth.'),
    Q('A hornpipe is written in 4/4 but played:', 'dotted — long-short, long-short', ['as straight eighths', 'in 6/8', 'as a waltz'], 'Swagger.', 'The written eighths are played long-short. Down on the long note, up on the short: the hornpipe lilt.'),
    Q('A bluegrass breakdown is usually counted in:', '2/4 or cut time — two big beats a bar', ['6/8', '3/4', '5/4'], 'Fast and two to the bar.', 'Breakdowns move too fast to count in four; the chop lands on the second half of each big beat.'),
    () => { const t = _TT[rnd(_TT.length)], p = PICK_BY[t.pick]; return {q: `Which picking pattern fits a ${t.name.toLowerCase()}?`, a: p.name, opts: strOpts(p.name, [...new Set(_TT.map(x => PICK_BY[x.pick].name))]), hint: t.feel + '.', why: `A ${t.name.toLowerCase()} is ${t.meter}: ${p.name} — ${p.blurb}.`}; },
    Q('In 3/4 the mandolin rhythm is:', 'bass note, chop, chop', ['chop on 2 and 4', 'all chops', 'bass on every beat'], 'Oom-pah-pah.', 'A waltz: the root on 1, chops on 2 and 3. The only ringing note is the bass.'),
  ],
  keysigs: [
    () => { const k = KEYS[1 + rnd(11)]; return {q: `A key signature with ${_SIG[k].n} ${_SIG[k].acc === '♯' ? 'sharp' : 'flat'}${_SIG[k].n === 1 ? '' : 's'} is which major key?`, a: k, opts: keyOpts(k), hint: _SIG[k].acc === '♯' ? 'The last sharp is one half step below the key.' : 'The second-to-last flat is the key.', why: `${_SIG[k].n}${_SIG[k].acc}: ${_SIG[k].notes.join(' ')} — ${k} major (or ${_SIG[k].rel} minor).`, svg: `<div style="width:160px">${staffSVG([], {key: k})}</div>`}; },
    () => { const k = KEYS[1 + rnd(11)]; return {q: 'Which major key is this signature?', a: k, opts: keyOpts(k), hint: `${_SIG[k].n} ${_SIG[k].acc === '♯' ? 'sharps' : 'flats'}.`, why: `${_SIG[k].notes.join(' ')} is ${k} major.`, svg: `<div style="width:160px">${staffSVG([], {key: k})}</div>`}; },
    Q('A key signature with no sharps or flats is:', 'C major or A minor', ['G major', 'F major', 'D major'], 'Nothing to add.', 'C major has no accidentals; A minor, its relative, shares the empty signature.'),
    Q('One sharp (F♯) is the key of:', 'G major or E minor', ['D major', 'F major', 'A major'], 'One course up from C.', 'G major: the last sharp, F♯, is a half step below G. Its relative minor, E minor, shares the signature.'),
    Q('The rule for reading a sharp key signature:', 'the last sharp is one half step below the key', ['the first sharp is the key', 'count the sharps and add one', 'the key is the last sharp'], 'F♯ → G.', 'The last sharp is the leading tone, a half step below the tonic. Two sharps end on C♯, so the key is D.'),
    Q('The rule for reading a flat key signature:', 'the second-to-last flat is the key', ['the last flat is the key', 'count the flats', 'the first flat is the key'], 'B♭ E♭ → B♭ major.', 'With two or more flats, the second-to-last flat names the key. One flat alone is F major.'),
    () => { const k = KEYS[1 + rnd(11)], n = _SIG[k].notes.at(-1); return {q: `In ${k} major, the ${_SIG[k].acc === '♯' ? 'last sharp' : 'last flat'} added is:`, a: n, opts: noteOpts(n), hint: _SIG[k].acc === '♯' ? 'F C G D A E B.' : 'B E A D G C F.', why: `${k} major: ${_SIG[k].notes.join(' ')}. The last is ${n}.`}; },
  ],
  tunes: [
    Q('AABB form means:', 'an 8-bar A part twice, then an 8-bar B part twice', ['two tunes played together', 'four different parts', 'the A part only'], 'Thirty-two bars a time through.', `${D.formAABB.blurb}.`),
    () => { const tr = _TR[rnd(_TR.length)]; return {q: `Which tradition is this: “${tr.blurb.split(':')[0]}”?`, a: tr.name, opts: strOpts(tr.name, _TR.map(x => x.name)), hint: tr.sound + '.', why: `${tr.name}: ${tr.blurb}`}; },
    () => { const tr = _TR[rnd(_TR.length)], k = tr.keys[rnd(tr.keys.length)]; return {q: `${tr.name} playing lives mostly in which keys?`, a: tr.keys.join(', '), opts: strOpts(tr.keys.join(', '), _TR.map(x => x.keys.join(', '))), hint: tr.sound + '.', why: `${tr.name}: ${tr.keys.join(', ')}. ${tr.tunes}.`}; },
    () => { const t = D.tunes[rnd(D.tunes.length)]; return {q: `“${t.name}” is in:`, a: `${t.key} ${SCALE_BY[t.scale].name}, ${t.meter}`, opts: strOpts(`${t.key} ${SCALE_BY[t.scale].name}, ${t.meter}`, D.tunes.map(x => `${x.key} ${SCALE_BY[x.scale].name}, ${x.meter}`).concat([`${t.key} Natural Minor, ${t.meter}`])), hint: t.blurb + '.', why: `${t.name}: ${t.key} ${SCALE_BY[t.scale].name} in ${t.meter}. ${t.blurb}.`, play: () => { audio(); const b = .4, unit = t.meter.endsWith('/8') ? b / 3 : b; let at = A.ctx.currentTime + .03; t.notes.slice(0, 12).forEach(n => { if (!n.rest) course(n.midi, at, {gain: .36, kind: 'note', dur: n.dur * unit * .9}); at += n.dur * unit; }); }}; },
    Q('How many bars is one time through an AABB tune?', '32', ['16', '8', '64'], '8 × 4.', 'Four 8-bar parts: 32 bars. A fiddle tune is usually played three times through.'),
    Q('Bluegrass came from:', 'old-time string-band music, shaped by Bill Monroe in the 1940s', ['Italian opera', 'Irish sessions in Boston', 'jazz'], 'Monroe’s band.', 'Monroe took the old-time string band, added the chop, the blues and the high harmony, and named it after his band, the Blue Grass Boys.'),
    Q('The mandolin came to America from:', 'Italy — the Neapolitan bowl-back', ['Ireland', 'Scotland', 'Germany'], 'Santa Lucia.', 'The Neapolitan mandolin arrived with Italian immigrants in the 1880s; Gibson carved the flat, American version in the 1900s that bluegrass later adopted.'),
    Q('Old Joe Clark is the standard example of a tune in:', 'Mixolydian', ['Dorian', 'harmonic minor', 'the blues scale'], 'The G natural in A.', 'A Mixolydian: a major tune with a flat seventh and a G chord where you expect E.'),
  ],
};
// the chords-in-key ear question needs a real factory; replace the placeholder with one that computes its answer
QBANK.chordsinkey[QBANK.chordsinkey.length - 1] = () => { const k = rndKey(), rows = _CK[k].rows, r = rows[1 + rnd(5)]; return {q: `Listen: the I chord of ${k}, then another chord from the key. Is the second one major or minor?`, a: r.q === 'm' ? 'Minor' : 'Major', opts: shuffle(['Major', 'Minor']), hint: 'ii iii vi are minor; IV V are major.', why: `That was ${r.name}, the ${ROMAN[r.deg - 1]} of ${k}: ${r.q === 'm' ? 'minor' : 'major'}.`, play: () => { audio(); const t = A.ctx.currentTime + .02; mstrum(rows[0].shape, 'D', t); mstrum(r.shape, 'D', t + .9); }}; };
const ROMAN = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];

/* ---------------------------------------------------------------- the Index */
PAGES.push({id: 'index', no: 'V', name: 'The Index', blurb: 'every term and idea in the book, organized', acc: 'var(--navy)', draw(v) {
  pageScroll = true;
  v.append(header('V', 'The <em>Index</em>', 'every term the book uses and the ideas behind each lesson', 'browse by topic, or A to Z · tap anything to open it', 'var(--navy)'));
  const st = state('indexpage', {sec: 'az'});
  const go = sec => { st.sec = sec; keep('indexpage', st); redraw(); };
  const navBtn = ([sec, label]) => h('button', {class: 'btn' + (st.sec === sec ? ' acc' : ''), style: 'justify-content:flex-start;text-align:left;min-height:42px', on: {click: () => go(sec)}}, label);
  const nav = h('div', {style: 'display:flex;flex-direction:column;gap:6px'},
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:2px'}, 'THE TERMS'),
    navBtn(['az', 'Everything A–Z']), ...IDX_GROUPS.map(g => navBtn([g[0], g[1]])),
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin:10px 0 2px'}, 'THE IDEAS'),
    ...INDEX_SUBS.filter(s => s[0] !== 'glossary').map(([k, nm]) => navBtn(['facts:' + k, nm])));
  const body = h('div', {style: 'display:flex;flex-direction:column;gap:12px;min-width:0'});
  const row = c => h('button', {class: 'gloss-row', 'data-c': c.id}, h('b', {}, c.term), h('span', {}, c.short));
  if (st.sec.startsWith('facts:')) {
    const k = st.sec.slice(6), name = (INDEX_SUBS.find(s => s[0] === k) || [])[1], facts = (D.theory.facts || []).filter(f => f.tag === k);
    body.append(sec2(name, 'the ideas behind the lessons · tap any term to open it', 'var(--navy)',
      h('div', {class: 'facts'}, facts.map(f => h('div', {class: 'fact'}, h('h3', {}, f.t), h('p', {html: glossify(f.b)}))))));
  } else if (st.sec === 'az') {
    const cs = (D.concepts || []).slice().sort((a, b) => a.term.localeCompare(b.term));
    const list = h('div', {class: 'gloss'}); let letter = '';
    cs.forEach(c => { const l = c.term[0].toUpperCase();
      if (l !== letter) { letter = l; list.append(h('div', {style: 'grid-column:1/-1;font-weight:900;color:var(--navy);margin:8px 0 0;letter-spacing:.1em'}, l)); }
      list.append(row(c)); });
    body.append(sec2('Everything A–Z', 'every term in the book · tap one to open it, then follow “see also”', 'var(--navy)', list));
  } else {
    const g = IDX_GROUPS.find(x => x[0] === st.sec) || IDX_GROUPS[0], byId = {}; (D.concepts || []).forEach(c => byId[c.id] = c);
    body.append(sec2(g[1], 'tap a term to open it · related terms link onward', 'var(--navy)',
      h('div', {class: 'gloss'}, g[2].filter(id => byId[id]).map(id => row(byId[id])))));
  }
  v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(185px,.3fr) minmax(0,1fr);align-items:start'}, nav, body));
}});


// the book's reading order: the course up front, then the rooms, then the Index
const PAGE_ORDER = ['cover', 'learn', 'practice', 'lab', 'double', 'index'];
PAGES.sort((a, b) => PAGE_ORDER.indexOf(a.id) - PAGE_ORDER.indexOf(b.id));
PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
