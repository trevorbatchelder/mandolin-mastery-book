  --p1:#3a6b55; --p2:#6f7a37; --p3:#9c3d26; --p4:#7a4a34; --p5:#3c4e6b;

}
/* Moon — the cool near-black night palette; moonlight silver/steel-blue, blackletter title */
:root[data-theme="moon"]{
  --bg:#0a0c10; --panel:#13161c; --panel2:#1b1f27; --ink:#dfe6ee; --ink2:#aab4c0; --mute:#78828f; --rule:#262c36;
  --rust:#7fa6c9; --gold:#b9c2cf; --wire:#333a46; --str:#cdd4dd; --onacc:#0a0c10; --dark:#000; --ondark:#dfe6ee;
  --p1:#6e93a8; --p2:#7f9a86; --p3:#9a8fb0; --p4:#8a97ab; --p5:#6477a0;
  --teal:#6e93a8; --sage:#7f9a86; --plum:#9a8fb0; --navy:#6477a0;
  --ok:#7f9a86; --warn:#b9c2cf; --bad:#c76b6b; --acc:#8fb3d6;
  --title:'UnifrakturMaguntia','Cinzel',serif; color-scheme:dark;
}
:root[data-theme="moon"] .brand-t{text-transform:none!important;letter-spacing:.012em!important}

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}

.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}

/* the book header */

.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}

/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}

.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}

.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}

/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}

/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */

:is(.btn,.chip,.seg button,.icon,.arrow,.thumb,.goalchip,.rate button,.toc button,.tempo2 button):active{transform:scale(.96)}
.go:active{transform:scale(.975)}

.play::before{transition:border-width .14s ease-out,width .14s ease-out,height .14s ease-out}

.ds-body{min-height:var(--room);align-items:stretch}
.ds-body>.neckwrap{display:flex;align-items:stretch;padding:14px}
table.cells.ds{height:100%;width:100%}
table.cells.ds td{font-size:24px}
table.cells.ds td small{font-size:13px}
table.cells.ds td.k{font-size:15px}
.ds-body>.stage{justify-content:center;background:var(--panel);border-radius:18px;padding:18px}
.ds-body .grid-svg svg{max-height:calc(var(--room) - 60px)}
@media (max-width:820px){
  :root{--room:auto}
  .stage.tall .sgrid .st{height:96px} .stage:not(.tall) .sgrid .st{height:64px}
  .ivgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ds-body{min-height:0} .companion svg{max-height:none;min-height:0}
}

/* ===== Liquid-glass pass: glass on the navigation layer only, springs for every motion, touch-down light ===== */
/* the material: tint from the page itself, blur + saturation for the lensing, a specular rim on top, a soft shadow under */
:root{--glass:color-mix(in srgb,var(--bg) 58%,transparent);--rim:rgba(255,255,255,.55);--glass-shadow:0 10px 30px rgba(40,25,10,.12),0 1px 3px rgba(40,25,10,.08)}
[data-theme="moon"]{--glass:color-mix(in srgb,var(--bg) 52%,transparent);--rim:rgba(255,255,255,.14);--glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="sun"]){--glass:color-mix(in srgb,var(--bg) 52%,transparent);--rim:rgba(255,255,255,.14);--glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4)}}
.glass,.pbar,.hd2{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8)}

/* the practice bar floats as a capsule over the page; the page scrolls under it */
.footband{display:none}
.pbar{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  min-height:0;padding:8px 10px;border:0;border-radius:32px;box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent),var(--glass-shadow);
  background-image:radial-gradient(140px 56px at var(--sx,50%) 0%,var(--spec),transparent 70%)}
.pg{padding-bottom:calc(var(--barh) + 40px)}
:root{--room:calc(100dvh - 190px)}
.toast{bottom:calc(var(--barh) + 30px + env(safe-area-inset-bottom,0px));border-radius:999px}

/* the top bar sticks as glass; content dissolves under its soft edge, and its shadow deepens once something is under it */
.hd2{position:sticky;top:0;z-index:20;margin:-14px -16px 0;padding:10px 16px;border-radius:0 0 26px 26px;transition:box-shadow var(--sp-snap-ms) var(--sp-snap)}
.hd2::after{content:'';position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;background:linear-gradient(var(--glass),transparent);opacity:0;transition:opacity .25s}
.under .hd2{box-shadow:inset 0 -1px 0 var(--rim),var(--glass-shadow)} .under .hd2::after{opacity:1}

/* touch-down: everything you can press sinks a little at once and lights from the touch point outward */
:is(button,.cbox,.chip,select){transition:transform var(--sp-press-ms) var(--sp-press),box-shadow var(--sp-snap-ms) var(--sp-snap),background-color .18s,color .18s}
:is(button,.cbox,.chip,select).pressing{transform:scale(.96)}
:is(.home-tiles button,.home-go).pressing{transform:scale(.975)}
.neckwrap.pressing,.pbar button.pressing{transform:none}
:is(button,.cbox,.chip,.neckwrap){position:relative;isolation:isolate}
:is(button,.cbox,.chip,.neckwrap).glow::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,white 55%,transparent) 0,transparent 55%);animation:glow .6s ease-out forwards}
@keyframes glow{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.25)}}
.cbox{border-radius:18px}
.cbox.on{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px rgba(40,25,10,.16)}

/* morphing thumbs: the selection is a glass pill that slides between options */
.seg.has-thumb,.keyring.has-thumb{position:relative}
.seg .thumb{position:absolute;z-index:0;border-radius:999px;background:var(--ink);box-shadow:inset 0 1px 0 color-mix(in srgb,white 25%,transparent),0 3px 10px rgba(40,25,10,.22);transform-origin:left center;will-change:transform}
.seg.has-thumb button{position:relative;z-index:1}
.seg.has-thumb button[aria-pressed="true"]{background:transparent}
.keyring .thumb{position:absolute;z-index:1;border-radius:14px;background:var(--ink);box-shadow:0 6px 16px rgba(40,25,10,.25);transform-origin:left top;will-change:transform}
.keyring.has-thumb button{z-index:0}
.keyring.has-thumb button[aria-pressed="true"]{background:transparent;z-index:2}
/* glass pills for the menus */
select{background-color:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--rim)}

/* page turns: sharpen out of a blur and slide in on the page spring; grow out of a tapped tile */
.pg{animation:turn var(--sp-page-ms) var(--sp-page) backwards}
.pg.back{animation:turnback var(--sp-page-ms) var(--sp-page) backwards}
.pg.grow{animation:grow var(--sp-page-ms) var(--sp-page) backwards}
@keyframes turn{from{opacity:0;filter:blur(10px);transform:translateX(40px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes turnback{from{opacity:0;filter:blur(10px);transform:translateX(-40px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes grow{from{opacity:0;filter:blur(12px);transform:scale(.9)}to{opacity:1;filter:none;transform:none}}
/* the lit pick cell and the lit table cell pop on the press spring */
.sgrid .st{transition:background-color .12s,transform var(--sp-press-ms) var(--sp-morph)}
.sgrid .st.now{transform:scale(1.06);box-shadow:0 8px 22px color-mix(in srgb,var(--gold) 45%,transparent)}
table.cells.ds td{transition:box-shadow var(--sp-snap-ms) var(--sp-snap)}

/* Double Stops fills the room (the split rule is more specific, so match it) */
.body.split.ds-body{min-height:var(--room);align-items:stretch}

/* honour the system settings, as Liquid Glass does */
@media (prefers-reduced-motion:reduce){
  .pg,.pg.back,.pg.grow{animation:none} :is(button,.cbox,.chip,select).pressing{transform:none} .cbox.on,.sgrid .st.now{transform:none}
  :is(button,.cbox,.chip,.neckwrap).glow::after{animation-duration:.001ms}
}
@media (prefers-reduced-transparency:reduce){ .glass,.pbar,.hd2,select{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none} }
@media (prefers-contrast:more){ .pbar,.hd2{box-shadow:inset 0 0 0 2px var(--ink)} .seg .thumb,.keyring .thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)} }
@media (max-width:820px){ .pbar{left:8px;right:8px;border-radius:26px;padding:6px 8px} .hd2{margin:-9px -16px 0;padding:8px 16px} }
.seg .thumb,.keyring .thumb{box-sizing:border-box;padding:0;margin:0;border:0;min-height:0;min-width:0}
/* the specular highlight is a token so the dark glass gets a faint rim, not a smear */
:root{--spec:rgba(255,255,255,.32)}
[data-theme="moon"]{--spec:rgba(255,255,255,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="sun"]){--spec:rgba(255,255,255,.05)}}
@media (max-width:820px){ .cgrid.hero-card{grid-template-columns:minmax(0,1fr)!important;justify-items:center} .hero-card .cbox svg{max-width:220px;width:220px} }

/* ===== Widgets pass (after Apple's "Design Great Widgets" and WWDC25's new design system) ===== */
/* each chapter tile is a widget: numeral, a glance at where you left that page, the name. One tap target per tile. */
.home-tiles button{justify-content:flex-start}
.home-tiles .glance{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:4px 0}
.glance .gsvg{height:100%;max-height:150px;display:flex;align-items:center;justify-content:center}
.glance .gsvg svg{height:100%;width:auto;max-width:100%}
.glance .gsvg.wide{width:100%;height:auto} .glance .gsvg.wide svg{width:100%;height:auto;max-height:140px}
.glance .mods{display:flex;gap:6px;width:100%;align-items:flex-end;height:70px}
.glance .mods i{flex:1;height:100%;border-radius:8px;background:linear-gradient(to top,var(--c) calc(var(--p) * 100%),color-mix(in srgb,var(--c) 16%,transparent) 0)}
.glance .picks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.glance .picks i{font-style:normal;font-weight:900;font-size:22px;text-align:center;padding:8px 0;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.glance .picks i.up{color:var(--rust)} .glance .picks i.chop{background:var(--rust);color:var(--onacc)} .glance .picks i.rest{opacity:.4}
.glance .term-day{font-family:var(--display);font-style:normal;font-size:30px;line-height:1.1;text-align:center;color:var(--ink);text-wrap:balance}
/* Continue carries the course as a ring: done of all, filled on the snap spring when the home screen draws */
.home-go{justify-content:space-between}
.home-go .ring{--p:0;width:clamp(110px,16vw,170px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--rust) 82%,transparent 83%),conic-gradient(var(--onacc) calc(var(--p) * 360deg),color-mix(in srgb,var(--onacc) 22%,transparent) 0)}
.home-go .ring span{font-family:var(--display);font-size:clamp(40px,5vw,58px);line-height:1}
.home-go .ring small{font-weight:800;font-size:14px;opacity:.8}
@media (max-width:820px){ .home-go .ring{width:84px} .home-go .ring span{font-size:30px} .home-go{flex-direction:row-reverse;align-items:center;justify-content:space-between} .home-tiles .glance{display:none} }

/* concentric corners: a nested shape's radius is its parent's minus the padding between them */
:root{--r-tile:22px;--r-panel:18px}
.home-tiles button,.home-go{border-radius:var(--r-tile)}
.glance .picks i{border-radius:calc(var(--r-tile) - 14px)}
.companion,.neckwrap,.ds-body>.stage{border-radius:var(--r-panel)}

/* the practice bar steps aside while you read down a page and comes back as soon as you scroll up (tabBarMinimizeBehavior .onScrollDown) */
.pbar{transition:left var(--sp-morph-ms) var(--sp-morph),right var(--sp-morph-ms) var(--sp-morph),padding var(--sp-snap-ms) var(--sp-snap)}
.pbar .station,.pbar .cta .what{max-width:640px;overflow:hidden;transition:max-width var(--sp-morph-ms) var(--sp-morph),opacity var(--sp-snap-ms) var(--sp-snap)}
@media (min-width:821px){
  .mini .pbar{left:calc(50% - 190px);right:calc(50% - 190px);justify-content:space-between}
  .mini .pbar .station,.mini .pbar .cta .what{max-width:0;opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){ .pbar,.pbar .station,.pbar .cta .what{transition:none} }
@media (min-width:821px){ .mini .pbar:not(:has(.go)){left:calc(50% - 74px);right:calc(50% - 74px)} }
/* the progress fills in when the home screen draws: a registered number animates where a bare custom property would jump */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
.home-go .ring,.glance .mods i{animation:fill 1.1s var(--sp-morph) backwards}
.glance .mods i:nth-child(n){animation-delay:calc(var(--i,0) * 40ms)}
@keyframes fill{from{--p:0}}
@media (prefers-reduced-motion:reduce){ .home-go .ring,.glance .mods i{animation:none} }
/* the lesson is the content, so it gets the big type; "Continue" is its label */
.home-go .go-t{display:flex;flex-direction:column;gap:8px}
.home-go .go-t b{font-size:clamp(28px,3.4vw,40px);line-height:1.08;text-wrap:balance}
@media (max-width:820px){ .home-go .go-t b{font-size:24px} }

/* ===== the game layer, in Sun and Moon: hearts, the chapter meter, the game bar, seals, the found bar ===== */
.quiz{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-name{display:flex;align-items:center;gap:8px;font-weight:800;align-self:center}
.quiz-name i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.qsteps{display:flex;gap:4px}
.qsteps i{flex:1;height:12px;border-radius:3px;background:var(--panel2)}
.qsteps i.now{background:var(--rule)}
.qsteps i.ok{background:var(--sage)}
.qsteps i.no{background:var(--bad)}
.qcount{text-align:center;font-weight:800;min-height:1.3em}
.qtext{font-size:21px;font-weight:800;min-height:1.4em;text-align:center}

.qfb{min-height:40px;text-align:center}
.take{background:var(--panel);border-radius:var(--r-panel,14px);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.take .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.take-row{display:flex;align-items:center;gap:10px}
.take-row .sp{flex:1}
.take-meter{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.take-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),color-mix(in srgb,var(--sage) 70%,var(--gold)));transition:width var(--sp-morph-ms,.4s) var(--sp-morph,ease-out)}
.take.clipped{animation:clip .5s ease-out}
@keyframes clip{0%{box-shadow:inset 0 0 0 3px var(--bad)}100%{box-shadow:inset 0 0 0 0 transparent}}
.take.kept .take-meter i{background:var(--sage)}
.gb-hearts{display:flex;gap:4px}
.gb-hearts i{font-style:normal;font-size:18px;line-height:1;color:var(--panel2);-webkit-text-stroke:1px var(--rule)}
.gb-hearts i::before{content:'♥'}
.gb-hearts i.on{color:var(--bad);-webkit-text-stroke:0;text-shadow:0 0 8px color-mix(in srgb,var(--bad) 45%,transparent)}
.pbar.gamebar{gap:10px}
.gb-stat{display:flex;flex-direction:column;align-items:center;line-height:1.05;position:relative;min-width:52px}
.gb-stat b{font-size:17px;font-weight:900;color:var(--rust);font-variant-numeric:tabular-nums}
.gb-stat small{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gb-stat .pts-gain{position:absolute;top:-16px;right:-6px;font-size:13px;font-weight:900;color:var(--ok);animation:gain 1.2s ease-out forwards}
.gb-stat .pts-gain.neg{color:var(--bad)}
@keyframes gain{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-10px)}}
.gb-prog{display:flex;flex-direction:column;gap:4px;min-width:150px;max-width:320px}
.gb-prog-t{display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-prog-t b{font-size:15px;font-weight:800}
.gb-prog-t small{font-size:12px;color:var(--mute);font-weight:700}
.gb-meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.gb-meter i{display:block;height:100%;background:var(--sage)}
.gb-btn{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:4px 10px;font-size:17px;font-weight:900;line-height:1.1;min-height:44px;justify-content:center;color:var(--ink)}
.gb-btn small{font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.gb-btn:disabled{opacity:.35;cursor:default}
.gb-back{font-size:14px;flex-direction:row}
@media (max-width:820px){ .gb-btn small,.gb-stat small,.gb-prog-t small{display:none} .gb-prog{min-width:90px} .pbar.gamebar{gap:6px} }
.btn.testout{min-height:30px;font-size:12px;padding:3px 10px;border-color:rgba(255,255,255,.65);color:#fff;background:rgba(0,0,0,.18)}
.seal{max-width:560px;margin:28px auto;text-align:center;background:var(--panel);border-radius:var(--r-panel,14px);padding:26px 24px 18px}
.seal-lock{display:grid;grid-template-columns:repeat(2,18px);gap:5px;justify-content:center;margin-bottom:12px}

.seal-lock i:first-child{background:var(--gold);animation:queued 1s steps(2,end) infinite}
@keyframes queued{50%{opacity:.35}}
.seal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:4px 0 8px}

.home-body.book{grid-template-columns:minmax(0,1fr)}

.cp-form span.muted,.cp-form b.muted{color:var(--mute);padding:0}
.cp-form .chip{min-height:30px;min-width:0;padding:3px 8px;font-size:12.5px}
.cp-where{border-left:3px solid var(--teal);padding:4px 0 4px 10px;font-size:14px;color:var(--ink2);display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.cp-where b{color:var(--ink)}
.cp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-tools .quiet{border-color:transparent;color:var(--ink2);padding-left:4px;padding-right:4px}
.cp-dialcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cp-dialcol>div:first-child{width:100%;display:flex;justify-content:center}
.cp-dial{width:100%;max-width:340px;height:auto;display:block;user-select:none;-webkit-user-select:none}
@media (min-height:900px){.cp-dial{max-width:440px}}
@media (max-width:760px){.cp-dial{max-width:420px}}
.cp-dial text{font-family:var(--body);pointer-events:none}
.cp-cell{cursor:pointer}
.cp-cell:focus-visible path:first-child{stroke:var(--gold);stroke-width:3}
.cp-needle{transition:transform .45s cubic-bezier(.3,1.35,.5,1);transform-origin:220px 220px}
@media (prefers-reduced-motion:reduce){.cp-needle{transition:none}}
/* the listening block under the wheel */
.cp-live{width:100%;max-width:430px;display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.cp-live{max-width:none}}
.cp-live .cp-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-live .cp-top .btn{min-width:7.5em;justify-content:center}
.cp-for{font-size:14px;min-height:40px;padding-top:5px;padding-bottom:4px;font-weight:700}
.cp-hear{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.cp-hear>div:first-child{min-width:0}
.cp-hear .cp-tune{grid-column:1/-1;text-align:left;color:var(--rust);font-weight:600}
.cp-hear .cp-tune:empty{display:none}
.cp-meter{position:relative;height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.cp-meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rule);border-radius:6px;transition:width .06s linear}
.cp-meter.hot i{background:var(--teal)}
.cp-meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.cp-cents{font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-cents:empty{display:none}
.cp-cents.ok{color:var(--ok)}
.cp-heardbox{display:flex;align-items:baseline;gap:9px;min-width:8ch;max-width:52%;justify-content:flex-end;text-align:right;flex-wrap:wrap}
.cp-heardbox b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;transition:opacity .2s;color:var(--ink)}
.cp-heardbox b.dim{opacity:.3}
.cp-heardbox small{font-size:12.5px;font-weight:700;color:var(--mute)}
/* the suggested chords: one line of chips, ruled in the wheel's own colours */
.cp-next{width:100%;max-width:430px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cp-next .lbl{font-size:12.5px;font-weight:700;color:var(--mute);margin-right:2px}
.cp-next .chip{border-left-width:4px;min-width:0;padding:4px 9px 3px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.cp-next .chip b{font-family:var(--display);font-weight:400;font-size:18px}
.cp-next .chip small{font-size:10.5px;font-weight:700;color:var(--mute)}
.cp-next .chip.next{border-left-color:var(--gold)}
.cp-next .chip.far{border-left-color:var(--rust)}
/* what a take heard: the chords, the key they fit */
.cp-msg{font-size:14px;color:var(--ink2)}
.cp-msg:empty{display:none}
.cp-msg b{color:var(--ink)}
.cp-take{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--teal);padding:2px 0 2px 10px}
.cp-take .heard{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.cp-take .heard .lbl{font-size:12px;font-weight:700;color:var(--mute);margin-right:4px}
.cp-take .heard b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.cp-take .heard .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--mute);min-height:0;padding:0 4px;align-self:center}
.cp-take .key{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cp-take .key .chip{min-height:30px;min-width:0;padding:3px 9px;font-size:12.5px}
.cp-take .key .chip.acc{background:var(--teal);border-color:var(--teal);color:var(--onacc)}
.cp-take .key b{color:var(--ink)}
.cp-lower{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.cp-lower .songs{display:flex;flex-wrap:wrap;gap:6px}
.cp-lower textarea{width:100%;min-height:76px;border:1.5px solid var(--rule);border-radius:9px;background:transparent;color:var(--ink);font:inherit;padding:8px}

</style>

dolin shimmers and why tremolo works: two strings never ring exactly alike.","see":["tuning","unison","tremolo"]},{"id":"tuning","term":"Tuning (G D A E)","short":"The four courses, low to high: G3 D4 A4 E5 — perfect fifths, the same as a violin.","more":"Because every neighbouring course is the same distance apart, one shape works on any pair of courses and slides to any key.","see":["fifth","symmetry","course"]},{"id":"fifth","term":"Perfect fifth","short":"Seven half steps. The interval between every pair of adjacent courses, and the same fret on the next course up.","more":"Fret 7 on any course is the next course open: that is the landmark the whole neck hangs on.","see":["tuning","interval","symmetry"]},{"id":"symmetry","term":"Fifths symmetry","short":"The mandolin’s superpower: with every course a fifth apart, a scale or chord shape is the same on any pair of courses and in every key once it has no open string.","more":"A guitar’s third between B and G breaks its shapes; the mandolin has no such break. Learn one closed shape and you own it everywhere.","see":["tuning","ffcp","chop-chord"]},{"id":"fret","term":"Fret","short":"The metal bars across the neck; pressing just behind one shortens the string by one half step per fret.","more":"Fret 12 is the octave of the open course. The dots usually mark 3 5 7 10 12 15.","see":["half-step","octave","landmark"]},{"id":"landmark","term":"Landmarks","short":"Frets you can find without counting: 5, 7 and 12. Fret 7 is the next course open; fret 12 is the octave; fret 5 is a fourth.","more":"","see":["fret","fifth","octave"]},{"id":"nut","term":"Nut","short":"The slotted bar at the top of the neck the open strings pass over; fret 0.","more":"","see":["fret","bridge"]},{"id":"bridge","term":"Bridge","short":"The floating wooden piece on the top that the strings cross, held down by string tension alone. Moving it changes intonation.","more":"If fret 12 does not match the harmonic at fret 12, the bridge has crept.","see":["nut","tailpiece","intonation"]},{"id":"tailpiece","term":"Tailpiece","short":"The metal piece at the bottom the strings hook into. Mandolin strings have loop ends, not ball ends.","more":"","see":["bridge"]},{"id":"f-hole","term":"F-holes and the oval hole","short":"F-style and many A-style mandolins have two f-holes like a violin; others have a single oval hole, which sounds rounder and quieter.","more":"","see":["a-style","f-style"]},{"id":"a-style","term":"A-style","short":"The teardrop-bodied mandolin. Same neck, same tuning, usually less money than an F-style; the sound difference is small.","more":"","see":["f-style","f-hole"]},{"id":"f-style","term":"F-style","short":"Gibson’s 1920s design with the scroll and points. The bluegrass look. The scroll is decoration; the f-holes and carved top are the sound.","more":"","see":["a-style","f-hole"]},{"id":"intonation","term":"Intonation","short":"Whether a fretted note is in tune with the open string. Set by where the bridge sits.","more":"Compare the fretted note at 12 with the harmonic at 12: sharp means the bridge is too far forward.","see":["bridge","tuner"]},{"id":"tuner","term":"Tuner","short":"The book’s Fretboard Lab listens through the microphone and shows how far each course is from G D A E.","more":"","see":["tuning","intonation"]},{"id":"pick","term":"Pick (plectrum)","short":"The mandolin is played with a pick, usually a thick, rounded one. Thin picks click; thick ones give the chop its bark.","more":"","see":["downstroke","upstroke","alternate-picking"]},{"id":"downstroke","term":"Downstroke (⊓)","short":"The pick moving down toward the floor — the strong stroke. It lands on the beat.","more":"","see":["upstroke","alternate-picking","pick"]},{"id":"upstroke","term":"Upstroke (V)","short":"The pick moving up — the light stroke, on the “and”.","more":"","see":["downstroke","alternate-picking"]},{"id":"alternate-picking","term":"Alternate picking","short":"Down-up-down-up without exception, the pick moving like a clock whether it hits a string or not. Downs on the beats.","more":"Keep the alternation even when the next note is on another course; that is what makes a reel sit in the groove.","see":["downstroke","upstroke","jig-picking"]},{"id":"jig-picking","term":"Jig picking (DUD DUD)","short":"In 6/8 the pattern is down-up-down, down-up-down, so a downstroke falls on each of the two big beats.","more":"Two downstrokes in a row is the whole trick: the hand resets on every big beat.","see":["alternate-picking","jig"]},{"id":"rest-stroke","term":"Rest stroke","short":"A downstroke that lands and rests on the next course instead of flying past — the Monroe downstroke, louder and darker.","more":"","see":["downstroke"]},{"id":"chop-chord","term":"Chop chord","short":"A closed four-finger chord with no open string, so it can be muted the instant it is struck and moved to any key.","more":"Three grips (the D-shape, F-shape and C-shape) cover the whole neck; the D-shape alone plays rhythm in every bluegrass key.","see":["chop","symmetry","closed-position"]},{"id":"chop","term":"The chop","short":"The bluegrass backbeat: a short, muted downstroke on beats 2 and 4. The mandolin is the band’s snare drum.","more":"Strike and release the fretting pressure in the same instant so the chord barks and dies. The fretting hand never leaves the strings.","see":["chop-chord","backbeat","downstroke"]},{"id":"backbeat","term":"Backbeat","short":"Beats 2 and 4 in 4/4 — where the chop lands and where the audience claps.","more":"","see":["chop","beat"]},{"id":"open-chord","term":"Open chord","short":"A chord using open courses, near the nut: G C D A E and their minors. The folk shapes.","more":"","see":["chop-chord","two-finger-chord"]},{"id":"two-finger-chord","term":"Two-finger chord","short":"G, C, D, Em and Dm each need only two fingers. The gateway to playing songs tonight.","more":"","see":["open-chord"]},{"id":"closed-position","term":"Closed position","short":"A hand position with no open strings — so everything under it moves with the hand.","more":"","see":["ffcp","chop-chord","symmetry"]},{"id":"ffcp","term":"FFcP (four-finger closed position)","short":"A system for scales: index, middle, ring and pinky each own a pair of frets, and the root sits under one of them. Four shapes, every key.","more":"One octave is two courses; the shape on courses 1–2 is the same on 2–3 and 3–4. Slide it and the key changes; nothing else does.","see":["closed-position","symmetry","scale"]},{"id":"first-position","term":"First position","short":"The hand near the nut: index around fret 2, pinky reaching fret 7. Open strings ring; most fiddle tunes live here.","more":"","see":["closed-position","open-chord"]},{"id":"double-stop","term":"Double stop","short":"Two notes at once on adjacent courses — the fiddle’s harmony, borrowed whole. Thirds and sixths above all.","more":"A third above sits three or four frets behind on the next course; a sixth sits one or two frets ahead. The quality changes as you move because the notes come from the key.","see":["third","sixth","harmony"]},{"id":"drone","term":"Drone","short":"An open course ringing under a melody on the next course. The old-time and Celtic sound; free on a fifths-tuned instrument.","more":"","see":["double-stop","open-chord","fifth"]},{"id":"tremolo","term":"Tremolo","short":"Rapid, even down-up strokes on one note so it sustains. The mandolin’s singing voice, and a measured subdivision before it is a blur.","more":"Start with four strokes a beat at the practice bar’s tempo, then six, then eight. Even first; fast later.","see":["course","alternate-picking","subdivision"]},{"id":"subdivision","term":"Subdivision","short":"How many strokes fit in one beat: two (eighths), three (triplets), four (sixteenths). Tremolo is a subdivision you stop counting.","more":"","see":["tremolo","beat"]},{"id":"kickoff","term":"Kickoff","short":"The instrumental intro that sets the tempo and key before the singing: on the mandolin, often four potatoes or the last line of the tune.","more":"","see":["potatoes","tag"]},{"id":"potatoes","term":"Potatoes","short":"The fiddler’s count-in: a long-short-short shuffle on a root-and-fifth double stop, four times. The mandolin borrowed it.","more":"","see":["kickoff","double-stop"]},{"id":"tag","term":"Tag","short":"A short ending phrase after the last chorus — “shave and a haircut” and its cousins.","more":"","see":["kickoff"]},{"id":"break","term":"Break","short":"A solo over one time through the song. In bluegrass the mandolin break usually comes right after the first chorus.","more":"","see":["kickoff","chop"]},{"id":"hammer-on","term":"Hammer-on and pull-off","short":"Sounding a note with the fretting finger alone: hammer onto a higher fret, or pull off to a lower one. Rolls and triplets live on these.","more":"","see":["slide","ornament"]},{"id":"slide","term":"Slide","short":"Fretting a note and sliding the finger to another fret while it rings. The bluesy entrance to a note, Monroe-style.","more":"","see":["hammer-on","ornament"]},{"id":"ornament","term":"Ornament","short":"A small decoration on a melody note: a roll, a cut, a triplet, a slide. Celtic playing is made of them.","more":"","see":["hammer-on","slide","triplet"]},{"id":"triplet","term":"Triplet","short":"Three notes in the time of two — the Irish ornament and the swing feel both start here.","more":"","see":["ornament","subdivision"]},{"id":"note","term":"Note","short":"A single pitch, named with the letters A to G.","more":"","see":["half-step","octave"]},{"id":"half-step","term":"Half step","short":"One fret. The smallest move in Western music; twelve of them make an octave.","more":"E to F and B to C are half steps; everywhere else a sharp or flat sits between the letters.","see":["whole-step","fret"]},{"id":"whole-step","term":"Whole step","short":"Two frets.","more":"The major scale is whole steps with two half steps in it: W W H W W W H.","see":["half-step","major-scale"]},{"id":"octave","term":"Octave","short":"The same note higher: twelve frets, or the next course five frets up, or two courses up and two frets back.","more":"","see":["note","fret","interval"]},{"id":"unison","term":"Unison","short":"Two strings on the same note. Each course is a unison pair; fret 7 on one course is a unison with the next course open.","more":"","see":["course","fifth"]},{"id":"sharp","term":"Sharp (♯)","short":"One half step higher — one fret up. Sharps arrive in the order F C G D A E B.","more":"","see":["flat","key-signature"]},{"id":"flat","term":"Flat (♭)","short":"One half step lower — one fret down. Flats arrive B E A D G C F.","more":"","see":["sharp","key-signature"]},{"id":"interval","term":"Interval","short":"The distance between two notes, counted in letters and measured in frets. On the mandolin every interval is a shape.","more":"A fifth is the same fret on the next course; an octave is five frets up on the next course; a third is three or four frets back.","see":["fifth","third","sixth","octave"]},{"id":"third","term":"Third","short":"Two letters up. Major (4 frets) is bright, minor (3) is soft. The note that gives a chord its mood, and the first harmony everyone finds.","more":"","see":["interval","double-stop","major-chord","minor-chord"]},{"id":"sixth","term":"Sixth","short":"Five letters up: a third below, lifted an octave. On adjacent courses it is the easiest double stop — one or two frets ahead.","more":"","see":["third","double-stop"]},{"id":"scale","term":"Scale","short":"A home note and its family, in order. A tune draws its notes from one.","more":"","see":["major-scale","mode","pentatonic","ffcp"]},{"id":"major-scale","term":"Major scale","short":"W W H W W W H: do re mi. The scale of G, D and A, the keys bluegrass lives in.","more":"","see":["scale","key","whole-step"]},{"id":"minor-scale","term":"Minor scale","short":"The darker cousin: ♭3 ♭6 ♭7. Natural minor is the major scale started from its 6th note.","more":"Most “minor” fiddle tunes are really Dorian — a bright 6th.","see":["scale","relative-minor","dorian"]},{"id":"pentatonic","term":"Pentatonic","short":"Five notes, no half steps. The major pentatonic is a Monroe break; the minor pentatonic is the blues.","more":"","see":["scale","blues-scale"]},{"id":"blues-scale","term":"Blues scale","short":"Minor pentatonic with the ♭5 added — the blue note between 4 and 5. Bluegrass bends it inside major keys.","more":"","see":["pentatonic","scale"]},{"id":"mode","term":"Mode","short":"The major scale started on a different note: same notes, different home. Fiddle tunes use two of them constantly.","more":"","see":["mixolydian","dorian","major-scale"]},{"id":"mixolydian","term":"Mixolydian","short":"Major with a flat 7th. Old Joe Clark, Red Haired Boy, most “modal” old-time tunes. The ♭VII chord lives here.","more":"","see":["mode","dorian"]},{"id":"dorian","term":"Dorian","short":"Minor with a bright 6th. Shady Grove, Cooley’s Reel, nearly every Irish tune called “minor”.","more":"","see":["mode","minor-scale","mixolydian"]},{"id":"key","term":"Key","short":"The home note of a tune plus its scale. Bluegrass favours G, A, B, B♭ and D; Irish sessions D, G, A, E minor and A Dorian.","more":"A singer’s key is whatever fits the voice; the mandolin follows with closed chords instead of a capo.","see":["key-signature","circle-of-fifths","tonic"]},{"id":"key-signature","term":"Key signature","short":"The sharps or flats at the start of the staff that belong to the key. One sharp is G, two is D, three is A.","more":"","see":["key","sharp","flat"]},{"id":"tonic","term":"Tonic","short":"The home note of a key — where a tune comes to rest.","more":"","see":["key","scale"]},{"id":"circle-of-fifths","term":"Circle of fifths","short":"The twelve keys in a ring, each a fifth up from the last, each adding a sharp. On the mandolin the ring is the neck: G D A E are four steps of it.","more":"A key’s V is one step clockwise, its IV one step back. The three touching keys give the three chords most tunes use.","see":["key","fifth","relative-minor"]},{"id":"relative-minor","term":"Relative minor","short":"The minor key sharing a major key’s notes, a minor third below: E minor for G, B minor for D.","more":"","see":["minor-scale","key"]},{"id":"root","term":"Root","short":"The note a chord is named after and built up from.","more":"","see":["chord","triad"]},{"id":"chord","term":"Chord","short":"Three or more notes sounding together. On the mandolin usually four courses, so one note is doubled.","more":"","see":["triad","root","open-chord","chop-chord"]},{"id":"triad","term":"Triad","short":"The basic three-note chord: root, third, fifth.","more":"","see":["chord","third","fifth"]},{"id":"major-chord","term":"Major chord","short":"A triad with a major third — bright. G, C, D, A.","more":"","see":["triad","third","minor-chord"]},{"id":"minor-chord","term":"Minor chord","short":"A triad with a minor third — darker. One fret separates it from major: drop the third one fret.","more":"","see":["triad","third","major-chord"]},{"id":"seventh-chord","term":"Seventh chord","short":"A triad with a flat seventh on top. The V7 (D7 in G) pulls hard back home.","more":"","see":["triad","cadence"]},{"id":"roman-numerals","term":"Roman numerals","short":"Chords named by their place in the key: I IV V major, ii iii vi minor, vii° diminished. A progression written this way works in any key.","more":"","see":["progression","key"]},{"id":"progression","term":"Progression","short":"The sequence of chords under a tune. I IV V is most of bluegrass; I and ♭VII is most of Old Joe Clark.","more":"","see":["roman-numerals","cadence"]},{"id":"cadence","term":"Cadence","short":"How a phrase lands: V to I is finished; ending on V hangs. The last two bars of every fiddle-tune part are a cadence.","more":"","see":["progression","seventh-chord"]},{"id":"chord-tone","term":"Chord tone","short":"A note that belongs to the chord underneath — root, third or fifth. The safe notes for a harmony or a break.","more":"","see":["chord","double-stop","harmony"]},{"id":"harmony","term":"Harmony","short":"A second line that agrees with the melody — on the mandolin, a double stop a third or sixth away.","more":"","see":["double-stop","third","sixth","chord-tone"]},{"id":"beat","term":"Beat","short":"The steady pulse you tap your foot to. Downstrokes land on it.","more":"","see":["backbeat","tempo","time-signature"]},{"id":"tempo","term":"Tempo (BPM)","short":"How fast the beat goes, in beats per minute. The practice bar sets it; the metronome keeps it.","more":"","see":["beat"]},{"id":"time-signature","term":"Time signature","short":"Beats per bar and which note gets a beat: 4/4 reels, 6/8 jigs, 3/4 waltzes, 2/4 breakdowns.","more":"","see":["beat","jig","reel"]},{"id":"reel","term":"Reel","short":"A dance tune in 4/4: straight eighths, a lean on 1 and 3, played with alternate picking.","more":"","see":["time-signature","jig","hornpipe"]},{"id":"jig","term":"Jig","short":"A dance tune in 6/8: two big beats of three. Picked DUD DUD.","more":"","see":["jig-picking","reel","time-signature"]},{"id":"hornpipe","term":"Hornpipe","short":"A 4/4 tune played dotted — long-short — with a swagger.","more":"","see":["reel","jig"]},{"id":"aabb","term":"AABB form","short":"Almost every fiddle tune: an 8-bar A part twice, an 8-bar B part twice, 32 bars a time through.","more":"","see":["reel","jig"]},{"id":"staff","term":"The staff","short":"Five lines music is written on. The mandolin reads the treble clef: lines E G B D F, spaces F A C E, the open G below on a ledger line.","more":"","see":["clef","tab"]},{"id":"clef","term":"Clef","short":"The sign at the start of the staff. Mandolin music uses the treble clef (𝄞), like the violin.","more":"","see":["staff"]},{"id":"tab","term":"Tab (tablature)","short":"Four lines, one per course, the E course on top; a number is the fret to play. Says where, not how long — read the rhythm from the staff above it.","more":"","see":["staff","fret"]},{"id":"ledger-line","term":"Ledger line","short":"A short extra line for notes above or below the staff. The open G course sits two ledger lines below the treble staff.","more":"","see":["staff"]},{"id":"headstock","term":"Headstock","short":"The end of the neck that carries the eight tuning machines, four a side.","more":"Tune the pair together: bring both strings of a course to the same note, or the course beats against itself.","see":["tuning","tuner","course"]},{"id":"fretboard","term":"Fretboard (fingerboard)","short":"The strip of hardwood on the face of the neck that the frets are set into. On a mandolin it is short: fifteen frets reach the body, twenty-odd in all.","more":"","see":["fret","landmark"]},{"id":"position-markers","term":"Position markers","short":"The dots on the face and side of the neck at frets 3, 5, 7, 10, 12 and 15 (some makers mark 9 instead of 10).","more":"Fret 7 is the next course; fret 12 is the octave; 5 and 7 bracket first position.","see":["landmark","fret"]},{"id":"string-numbers","term":"String numbers","short":"Courses are counted from the highest: the E course is the 1st, A the 2nd, D the 3rd, G the 4th. Tab and the chord boxes here label them by letter instead.","more":"","see":["course","tab","chord-box"]},{"id":"open-string","term":"Open string","short":"A course sounded with no finger on it: G, D, A or E. Open courses ring longest, drone under tunes, and are the reason a chop chord avoids them.","more":"","see":["course","drone","chop-chord"]},{"id":"relative-tuning","term":"Tuning by ear (the 7th-fret method)","short":"Fret the G course at 7 and it should match the open D; D at 7 matches A; A at 7 matches E. Tune each course to the one below it.","more":"Tune the E course to a reference first, then work down: the high course drifts least.","see":["tuning","fifth","tuner"]},{"id":"action","term":"Action","short":"The height of the strings above the frets. Low action is easy on the left hand but buzzes; mandolins run higher than guitars because the strings are short and tight.","more":"","see":["bridge","intonation"]},{"id":"mandolin-family","term":"The mandolin family","short":"Mandolin (G D A E), mandola (a fifth lower, C G D A), octave mandolin (an octave lower) and mandocello (an octave below the mandola). Same shapes, same fifths, bigger bodies.","more":"","see":["tuning","symmetry"]},{"id":"bowlback","term":"Bowlback (Neapolitan)","short":"The older Italian mandolin with a rounded, ribbed back and a bent top. Sweeter and quieter than the carved American A and F styles; the classical tremolo was born on it.","more":"","see":["a-style","f-style","tremolo"]},{"id":"scroll","term":"Scroll","short":"The curl on the upper bout of an F-style mandolin. Decoration from Gibson in the 1920s: it adds weight and price, not sound.","more":"","see":["f-style","a-style"]},{"id":"strap","term":"Strap","short":"Holds the mandolin so the left hand is free to move instead of propping the neck. Tie it at the scroll or a strap button, and at the tailpiece end.","more":"","see":["tailpiece"]},{"id":"capo","term":"Capo","short":"A clamp across the neck that raises every open course. Guitarists live by it; mandolin players rarely need one, because the closed shapes already slide to any key.","more":"","see":["transpose","open-string","chop-chord"]},{"id":"crosspicking","term":"Crosspicking","short":"A rolling pattern across three courses with one pick — the banjo roll on a mandolin (Jesse McReynolds). Usually DUD DUD DU over a chord shape, eight notes to the bar.","more":"","see":["alternate-picking","jig-picking","chord-tone"]},{"id":"shuffle","term":"Shuffle (swing feel)","short":"Eighth notes played long-short instead of evenly: the first of each pair gets about two thirds of the beat. Hornpipes and swing tunes are written straight and played shuffled.","more":"","see":["hornpipe","beat","subdivision"]},{"id":"syncopation","term":"Syncopation","short":"An accent where the ear does not expect one — on an offbeat or between beats. The chop on 2 and 4 is the plain backbeat; a chop pushed early is syncopated.","more":"","see":["backbeat","offbeat","accent"]},{"id":"offbeat","term":"Offbeat","short":"The “and” between two beats, where the upstroke lands in alternate picking. Reggae puts the chord there; bluegrass puts the chop on the beat.","more":"","see":["beat","upstroke","syncopation"]},{"id":"downbeat","term":"Downbeat","short":"Beat 1 of the bar, the one the downstroke and the foot both land on. Kickoffs aim at it; tags land on it.","more":"","see":["beat","downstroke","kickoff"]},{"id":"accent","term":"Accent (>)","short":"A note played louder than its neighbours. The chop is an accented mute; a jig leans on 1 and 4; a reel on 1 and 3.","more":"","see":["downbeat","backbeat","jig"]},{"id":"dynamics","term":"Dynamics","short":"How loud: p (piano, soft) to f (forte, loud). On a mandolin dynamics come from how deep the pick goes and how much of the tremolo you use.","more":"","see":["tremolo","accent"]},{"id":"groove","term":"Groove","short":"The feel of the rhythm once it repeats: where the chop sits, how straight the eighths are, how hard beat 1 leans. The band agrees on it without a word.","more":"","see":["backbeat","shuffle","chop"]},{"id":"count-in","term":"Count-in","short":"The spoken “one, two, three, four” (or the potatoes) that sets the tempo before the first note.","more":"","see":["potatoes","tempo","kickoff"]},{"id":"barre","term":"Barre","short":"One finger laid flat across two or more courses at the same fret. The D-shape chop chord barres the two middle courses with the index; the ring and pinky do the rest.","more":"","see":["chop-chord","closed-position","finger-numbers"]},{"id":"vibrato","term":"Vibrato","short":"A gentle wobble in pitch from rocking the fretting finger along the string. The classical mandolin uses it under long tremolo notes; bluegrass mostly leaves it to the fiddle.","more":"","see":["tremolo","slide"]},{"id":"position-shift","term":"Position shift","short":"Moving the whole hand up or down the neck so a different fret sits under the index finger. FFcP shapes move as a block; the shift is the only thing that changes.","more":"","see":["ffcp","first-position","closed-position"]},{"id":"finger-numbers","term":"Finger numbers","short":"1 index, 2 middle, 3 ring, 4 pinky — the numbers inside the chord boxes and under the scale patterns. In first position they fall on frets 2, 3, 5 and 7.","more":"","see":["chord-box","first-position","ffcp"]},{"id":"muted-note","term":"Muted note (×)","short":"A course struck while a finger touches it without pressing: a click instead of a pitch. The chop is a whole chord muted a moment after it rings; × in a chord box means do not sound this course.","more":"","see":["chop","chop-chord","chord-box"]},{"id":"chord-box","term":"Chord box","short":"The little grid that shows a chord: four vertical lines for the courses (G on the left), horizontal lines for frets, dots for fingers, ○ for an open course and × for a muted one.","more":"","see":["finger-numbers","open-string","muted-note"]},{"id":"scale-diagram","term":"Scale pattern","short":"A grid of the neck with the scale’s notes marked and numbered by finger or degree. The four-fret FFcP patterns in the Lab are scale patterns you can slide.","more":"","see":["ffcp","scale","finger-numbers"]},{"id":"arpeggio","term":"Arpeggio","short":"A chord played one note at a time instead of all at once. Crosspicking is arpeggios with a rhythm; a kickoff often runs up an arpeggio to the downbeat.","more":"","see":["chord","crosspicking","chord-tone"]},{"id":"legato","term":"Legato","short":"Notes joined smoothly, without a pick stroke between them: hammer-ons, pull-offs and slides. The opposite of the articulate down-up of alternate picking.","more":"","see":["hammer-on","slide","alternate-picking"]},{"id":"natural","term":"Natural (♮)","short":"A note that is neither sharp nor flat — the letters on their own. The ♮ sign cancels a sharp or flat for the rest of the bar.","more":"","see":["sharp","flat","accidental"]},{"id":"accidental","term":"Accidental","short":"A sharp, flat or natural written beside a note rather than in the key signature. It lasts to the end of the bar. In fiddle tunes the ♮ on a seventh is the Mixolydian tell.","more":"","see":["sharp","flat","natural","key-signature"]},{"id":"enharmonic","term":"Enharmonic","short":"Two names for one pitch: F♯ and G♭ are the same fret. Which name you use depends on the key — the key of D has a C♯, never a D♭.","more":"","see":["sharp","flat","key"]},{"id":"chromatic","term":"Chromatic","short":"Moving by half steps — every fret in a row. The chromatic scale is all twelve notes; a chromatic run walks between two chord tones one fret at a time.","more":"","see":["half-step","scale"]},{"id":"musical-alphabet","term":"The musical alphabet","short":"A B C D E F G, then A again. Between most letters is a whole step (two frets); between B–C and E–F only a half step (one fret). That is why the naturals are not evenly spaced on the neck.","more":"","see":["note","half-step","whole-step"]},{"id":"tritone","term":"Tritone","short":"Six half steps, half an octave: the restless interval inside every dominant seventh chord. On the mandolin it is the next course one fret back.","more":"","see":["interval","seventh-chord","dominant-seventh"]},{"id":"perfect-interval","term":"Perfect intervals","short":"The unison, fourth, fifth and octave: the intervals that are neither major nor minor. The courses are tuned a perfect fifth apart, so the fifth is always the same fret on the next course.","more":"","see":["fifth","fourth","octave","unison"]},{"id":"interval-quality","term":"Interval quality","short":"Major, minor, perfect, augmented or diminished — the flavour of an interval at a given size. A third is major at four frets, minor at three.","more":"","see":["interval","third","perfect-interval"]},{"id":"inversion","term":"Inversion","short":"Turn an interval over by moving the lower note up an octave: a third becomes a sixth, a fifth becomes a fourth. That is why the sixths on the Double Stops page are the thirds turned over.","more":"","see":["third","sixth","octave"]},{"id":"fourth","term":"Fourth","short":"Five half steps. On the mandolin a perfect fourth is the next course two frets back; the fourth of the key is the note the IV chord is built on.","more":"","see":["interval","perfect-interval","fifth"]},{"id":"octave-shape","term":"Octave shape","short":"The same letter twelve half steps up: on the mandolin, up one course and five frets, or up two courses and back two frets.","more":"","see":["octave","fifth","symmetry"]},{"id":"augmented","term":"Augmented","short":"An interval one half step wider than major or perfect; a triad with a raised fifth. Rare in fiddle tunes, common in the tag that walks up to the V.","more":"","see":["interval-quality","triad","tag"]},{"id":"diminished","term":"Diminished","short":"An interval one half step narrower than minor or perfect; the vii° chord of a key, a stack of minor thirds. The chop grip for it is the minor grip with the fifth dropped a fret.","more":"","see":["interval-quality","triad","roman-numerals"]},{"id":"diatonic","term":"Diatonic","short":"Belonging to the key: the seven notes of its scale and the chords built on them. A diatonic melody never needs an accidental.","more":"","see":["key","scale","accidental"]},{"id":"scale-degree","term":"Scale degree","short":"A note’s number in its scale, 1 to 7. The patterns in the Lab are labelled by degree so the same shape reads in any key.","more":"","see":["scale","tonic","dominant"]},{"id":"supertonic","term":"Supertonic (2)","short":"The second degree of the scale and the ii chord built on it: the minor chord that leads to V in a ii–V–I.","more":"","see":["scale-degree","roman-numerals"]},{"id":"mediant","term":"Mediant (3)","short":"The third degree: the note that makes the key major or minor, and the iii chord, the least used in fiddle tunes.","more":"","see":["scale-degree","third"]},{"id":"subdominant","term":"Subdominant (4)","short":"The fourth degree and the IV chord: the “away” chord, one step anticlockwise on the circle. The second chord of most bluegrass songs.","more":"","see":["scale-degree","circle-of-fifths","fourth"]},{"id":"dominant","term":"Dominant (5)","short":"The fifth degree and the V chord: the one that pulls home to I. One step clockwise on the circle; the next course up on the mandolin.","more":"","see":["scale-degree","fifth","cadence"]},{"id":"submediant","term":"Submediant (6)","short":"The sixth degree and the vi chord — the relative minor, sitting inside the major key. Where a sad verse goes.","more":"","see":["scale-degree","relative-minor"]},{"id":"leading-tone","term":"Leading tone (7)","short":"The seventh degree, a half step under the tonic, leaning on it. Flatten it and the key turns Mixolydian: the fiddle’s favourite trick.","more":"","see":["scale-degree","mixolydian","tonic"]},{"id":"parallel-key","term":"Parallel keys","short":"A major and a minor key with the same tonic: G major and G minor. They share a root, not a key signature; relative keys share the signature, not the root.","more":"","see":["key","relative-minor","minor-scale"]},{"id":"natural-minor","term":"Natural minor","short":"The relative minor’s own scale, 1 2 ♭3 4 5 ♭6 ♭7 — the major scale started on its sixth note. Aeolian.","more":"","see":["minor-scale","relative-minor","mode"]},{"id":"harmonic-minor","term":"Harmonic minor","short":"Natural minor with the seventh raised, so the V chord is major and pulls home. The raised note gives it the “gypsy” step.","more":"","see":["natural-minor","leading-tone","dominant"]},{"id":"melodic-minor","term":"Melodic minor","short":"Natural minor with the sixth and seventh raised going up, so a line can climb to the tonic without a gap. Classical players lower them again coming down.","more":"","see":["natural-minor","harmonic-minor"]},{"id":"blue-note","term":"Blue note","short":"The ♭3, ♭5 or ♭7 slipped into a major key — bent, slid or hammered toward the “right” note. Monroe’s bluegrass is major keys full of blue notes.","more":"","see":["blues-scale","pentatonic","slide"]},{"id":"ionian","term":"Ionian","short":"The major scale by its mode name: the first mode. Everything else is measured against it.","more":"","see":["major-scale","mode"]},{"id":"aeolian","term":"Aeolian","short":"The natural minor by its mode name: the sixth mode, the major scale from its sixth note.","more":"","see":["natural-minor","mode"]},{"id":"lydian","term":"Lydian","short":"Major with a raised fourth (the major scale from its fourth note). Bright and floating; rare in traditional tunes, common in film scores.","more":"","see":["mode","fourth"]},{"id":"phrygian","term":"Phrygian","short":"Minor with a flat second (the major scale from its third note). The Spanish sound; almost never in a fiddle tune.","more":"","see":["mode","minor-scale"]},{"id":"transpose","term":"Transpose","short":"Move a tune to another key: every note up or down by the same interval. On the mandolin a closed shape transposes by sliding; an open-position tune has to be refingered.","more":"","see":["key","symmetry","closed-position"]},{"id":"modulation","term":"Modulation","short":"Changing key inside a tune. Fiddle tunes seldom do; songs often step up a whole tone for the last chorus, and the chop grips just slide two frets.","more":"","see":["key","transpose"]},{"id":"chord-quality","term":"Chord quality","short":"What kind of chord sits on a root: major, minor, seventh, diminished… The chop grips on the Chords page are one root in four qualities.","more":"","see":["chord","major-chord","minor-chord","seventh-chord"]},{"id":"dominant-seventh","term":"Dominant 7 chord","short":"A major triad with a ♭7 on top (G7 = G B D F). The V7 of a key; its tritone is what pulls it home to I.","more":"","see":["seventh-chord","dominant","tritone"]},{"id":"major-seventh","term":"Major 7 chord","short":"A major triad with the natural 7 (Gmaj7 = G B D F♯). Soft and jazzy; a swing-tune colour, not a bluegrass one.","more":"","see":["seventh-chord","chord-quality"]},{"id":"minor-seventh","term":"Minor 7 chord","short":"A minor triad with a ♭7 (Am7 = A C E G). The ii chord of a ii–V–I; the m7 grip on the Chords page.","more":"","see":["seventh-chord","minor-chord","supertonic"]},{"id":"sus-chord","term":"Sus chord","short":"A triad with its third replaced by the 2 (sus2) or the 4 (sus4): neither major nor minor, waiting to resolve. Dsus4 is D with the F♯ pushed up a fret.","more":"","see":["triad","third","resolution"]},{"id":"slash-chord","term":"Slash chord","short":"A chord over a different bass note: G/B is a G chord with B lowest. The mandolin rarely plays the bass, so read it as the chord before the slash.","more":"","see":["chord","root"]},{"id":"voicing","term":"Voicing","short":"Which octave each note of a chord sits in and in what order. The same G as an open shape, a D-shape chop and an F-shape chop is three voicings.","more":"","see":["chord","chop-chord","open-chord"]},{"id":"authentic-cadence","term":"Authentic cadence (V–I)","short":"The strongest ending: the V chord into the I. The last two bars of nearly every fiddle tune.","more":"","see":["cadence","dominant","tonic"]},{"id":"plagal-cadence","term":"Plagal cadence (IV–I)","short":"The “amen” ending: IV into I. Softer than V–I; the end of many hymns and gospel songs.","more":"","see":["cadence","subdominant"]},{"id":"half-cadence","term":"Half cadence","short":"A phrase that stops on the V and hangs there. The end of the A part’s first time through, before the repeat takes it home.","more":"","see":["cadence","dominant","aabb"]},{"id":"deceptive-cadence","term":"Deceptive cadence (V–vi)","short":"V goes to vi instead of I: the ear expected home and got the relative minor. One more time around.","more":"","see":["cadence","submediant"]},{"id":"resolution","term":"Tension and resolution","short":"Chords and notes that lean (the V, the leading tone, the tritone) and the moment they land (the I, the tonic). Music is the pull and the arrival.","more":"","see":["dominant","leading-tone","cadence"]},{"id":"turnaround","term":"Turnaround","short":"The last bars of a part that point back to the top: usually a V, or I–vi–ii–V. Tags are turnarounds that end instead.","more":"","see":["tag","dominant","progression"]},{"id":"twelve-bar-blues","term":"12-bar blues","short":"Three lines of four bars on I, IV and V: I I I I · IV IV I I · V IV I I. Bluegrass borrowed it for the fast instrumentals.","more":"","see":["progression","blues-scale","blue-note"]},{"id":"borrowed-chord","term":"Borrowed chord","short":"A chord from the parallel key or mode. The ♭VII in a major tune (the F chord in G) is borrowed from Mixolydian — the old-time sound.","more":"","see":["parallel-key","mixolydian","roman-numerals"]},{"id":"nashville-numbers","term":"Nashville numbers","short":"Chords written as numbers, 1 4 5, so a chart works in any key. Bluegrass and country bands call tunes this way: “it’s a 1–4–5 in B”.","more":"","see":["roman-numerals","transpose","progression"]},{"id":"bar","term":"Bar (measure)","short":"The beats between two bar lines: four in a reel, three in a waltz, six eighths in a jig. Tune parts are counted in bars — eight to a part.","more":"","see":["beat","time-signature","aabb"]},{"id":"note-values","term":"Note values","short":"Whole, half, quarter, eighth, sixteenth: each half as long as the one before. A quarter note is one beat in 4/4; an eighth is one pick stroke of a reel.","more":"","see":["beat","subdivision","dotted-note"]},{"id":"rest","term":"Rest","short":"A silence with a length: whole, half, quarter and eighth rests match the notes. The chop is a note and a rest in one stroke.","more":"","see":["note-values","beat"]},{"id":"beam","term":"Beam","short":"The thick bar that joins the stems of eighths and sixteenths. Reels beam in fours, jigs in threes: the beams show you the big beats.","more":"","see":["note-values","reel","jig"]},{"id":"dotted-note","term":"Dotted note","short":"A dot after a note adds half its length again: a dotted quarter is a beat and a half. The jig’s last note is a dotted quarter; a hornpipe is written dotted all through.","more":"","see":["note-values","hornpipe","jig"]},{"id":"tie","term":"Tie","short":"A curve joining two notes of the same pitch into one longer note, often across a bar line. Not a slur, which joins different pitches.","more":"","see":["note-values","bar"]},{"id":"compound-time","term":"Compound time","short":"Time signatures where the beat splits in three: 6/8 (two beats), 9/8 (three), 12/8 (four). Jigs are 6/8; slides are 12/8.","more":"","see":["time-signature","jig","beat"]},{"id":"pickup-notes","term":"Pickup notes (anacrusis)","short":"The note or two before the first full bar that lead into beat 1. Most fiddle tunes start on a pickup; count “and-a-1”.","more":"","see":["downbeat","bar","kickoff"]},{"id":"repeat-sign","term":"Repeat sign","short":"Two dots by a double bar line: play the section again. AABB form is written as an A part with a repeat and a B part with a repeat.","more":"","see":["aabb","endings"]},{"id":"endings","term":"First and second endings","short":"A bracket marked 1 over the last bar the first time through and 2 the second time: the repeat takes a different exit. Common at the end of a fiddle tune’s A part.","more":"","see":["repeat-sign","aabb"]},{"id":"waltz","term":"Waltz","short":"A tune in 3/4: ONE two three. The mandolin plays bass on 1 and chops 2 and 3; Tennessee Waltz, Kentucky Waltz.","more":"","see":["time-signature","chop","bar"]},{"id":"polka","term":"Polka","short":"A quick tune in 2/4 with a bouncing oom-pah. Common in Irish sessions and in Scandinavian and Texas dance music.","more":"","see":["time-signature","reel"]},{"id":"march","term":"March","short":"A tune in 2/4 or 4/4 with a steady step, slower than a reel. Scottish pipe marches cross into the mandolin repertoire.","more":"","see":["time-signature","reel"]},{"id":"strathspey","term":"Strathspey","short":"A Scottish 4/4 tune with the snap: a short note then a long one, the reverse of the hornpipe’s dotted swagger.","more":"","see":["hornpipe","dotted-note","reel"]},{"id":"slip-jig","term":"Slip jig","short":"A jig in 9/8: three groups of three. Lighter and longer-limbed than the 6/8 jig; The Butterfly is one.","more":"","see":["jig","compound-time"]},{"id":"breakdown","term":"Breakdown","short":"A fast bluegrass instrumental, usually in AABB form, with a break for each instrument in turn: Foggy Mountain Breakdown, Bluegrass Breakdown.","more":"","see":["break","aabb","reel"]},{"id":"fiddle-tune","term":"Fiddle tune","short":"A dance tune — reel, jig, hornpipe, waltz — passed on by ear, in AABB form, played round and round. The mandolin’s core repertoire, because it is tuned like the fiddle.","more":"","see":["reel","jig","aabb","tuning"]},{"id":"session","term":"Session (jam)","short":"Players around a table trading tunes. Irish sessions play the tune in unison; a bluegrass jam passes breaks round the circle while the rest chop.","more":"","see":["fiddle-tune","break","chop"]},{"id":"verse-chorus","term":"Verse and chorus","short":"The song shapes behind bluegrass singing: verses tell the story, the chorus repeats. The mandolin takes its break over a verse.","more":"","see":["break","aabb"]}],"aliases":{"courses":"course","strings":"course","string pair":"course","tuned in fifths":"tuning","fifths":"fifth","perfect fifth":"fifth","frets":"fret","neck":"fret","landmarks":"landmark","f-holes":"f-hole","oval hole":"f-hole","a-style":"a-style","f-style":"f-style","plectrum":"pick","picks":"pick","downstrokes":"downstroke","upstrokes":"upstroke","alternate pick":"alternate-picking","down-up":"alternate-picking","dud dud":"jig-picking"," breakdowns":"breakdown","fiddle tunes":"fiddle-tune","sessions":"session","jam":"session","jams":"session","verse":"verse-chorus","chorus":"verse-chorus"},"theory":{"facts":[{"t":"Eight strings, four notes","b":"The mandolin has eight strings in four pairs. Each pair is tuned to one note and played as one: that is a course. The doubling is why it shimmers.","tag":"instrument"},{"t":"Tuned like a violin","b":"G D A E, low to high, every course a perfect fifth above the last. A violinist can pick one up and play; a guitarist has to unlearn the fourths.","tag":"instrument"},{"t":"A-style, F-style","b":"The teardrop A and the scrolled F have the same neck and tuning. The scroll is a 1920s ornament; the carved top and the f-holes are the sound. Buy the one that sounds good.","tag":"instrument"},{"t":"The bridge floats","b":"Nothing holds the bridge but string tension. If fretted notes go sharp or flat up the neck, it has crept: match fret 12 to the harmonic at 12 and move it.","tag":"instrument"},{"t":"Thick pick, loose wrist","b":"A thick, rounded pick gives the chop its bark and the tremolo its smoothness. The motion comes from the wrist, not the arm, and the pick barely enters the strings.","tag":"instrument"},{"t":"Fret 7 is the next string","b":"Press any course at fret 7 and you have the next course open. Every scale, chord and double stop on the instrument follows from that one fact.","tag":"neck"},{"t":"The octave is a shape","b":"Up a course and five frets, or up two courses and back two frets. Both are an octave; the second keeps the hand in one place.","tag":"neck"},{"t":"One shape, every key","b":"A closed shape has no open string, so sliding it two frets moves the key up a whole step and changes nothing else. On a guitar the B string breaks this; on the mandolin nothing does.","tag":"neck"},{"t":"Thirds behind, sixths ahead","b":"A third above sits three or four frets behind on the next course; a sixth above sits one or two frets ahead. Which one depends on where you are in the key — the ear fixes it before the hand does.","tag":"neck"},{"t":"Fewest fingers first","b":"G, C, D, Em and Dm need two fingers each. With those five you can play along with most of the songs at a jam tonight; the four-finger shapes can wait.","tag":"chords"},{"t":"The chop is the drummer","b":"In a bluegrass band there is no drum kit. The mandolin chop on 2 and 4 — a muted bark, not a ringing chord — is the backbeat the whole band leans on.","tag":"chords"},{"t":"Why chop chords have no open string","b":"A chord with an open course cannot be muted by relaxing the fretting hand, and it cannot be moved. Closed grips give you both: the bark and every key.","tag":"chords"},{"t":"Three grips cover the neck","b":"The D-shape, F-shape and C-shape chop chords each put the root under a different finger. Learn the D-shape first: one grip, every key, by counting frets.","tag":"chords"},{"t":"Drop the third one fret","b":"A major chord becomes minor by lowering its third one fret. A becomes Am, D becomes Dm, the chop chord becomes the minor chop. One finger moves.","tag":"chords"},{"t":"Four fingers, two frets each","b":"FFcP: index owns the first two frets of the position, middle the next two, ring the next, pinky the last two. The hand never shifts inside a position; it only slides between them.","tag":"scales"},{"t":"Two courses make an octave","b":"Degrees 1 to 4 on one course are the same frets as 5 to 8 on the next. That is the major scale on the mandolin: one four-fret pattern, twice.","tag":"scales"},{"t":"The fiddle’s two modes","b":"Old-time and Celtic tunes live in Mixolydian (major with a ♭7 — Old Joe Clark) and Dorian (minor with a bright 6 — Shady Grove). If a tune sounds major but never resolves, it is Mixolydian.","tag":"scales"},{"t":"The pentatonic break","b":"Drop the 4th and 7th and nothing clashes: five safe notes, the shape of most bluegrass fills. Add the ♭3 as a passing note and it turns blue.","tag":"scales"},{"t":"G D A E are four steps of the circle","b":"The courses walk the circle of fifths. One course up is one sharp more; the key of the next course is the V of the one below.","tag":"keys"},{"t":"Bluegrass keys","b":"G, A, B♭, B and D, chosen for the singer. The guitar capos; the mandolin slides its closed chords instead. B♭ is just the A chop one fret up.","tag":"keys"},{"t":"Session keys","b":"Irish and Scottish sessions live in D, G, A, E minor, A Dorian and B minor — the keys where the open courses drone under the tune.","tag":"keys"},{"t":"Chords in a key","b":"Build a triad on each note of the major scale and the pattern is always major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°.","tag":"keys"},{"t":"Why a third","b":"Play the tune note on one course and the note two letters up on the next course, three or four frets back. That is the third above, and it is a chord tone of nearly every chord the melody is on.","tag":"harmony"},{"t":"Why the shape keeps changing","b":"A third above G is B — four frets, major. A third above A is C — three frets, minor. The hand moves one fret because every harmony note comes from the key.","tag":"harmony"},{"t":"Sixths are thirds turned over","b":"A third below, lifted an octave, is a sixth above. On adjacent courses the sixth is the easier reach: one or two frets ahead instead of three or four behind.","tag":"harmony"},{"t":"The drone is free","b":"Any open course under a melody on the course above is a fifth below it — the old-time and Celtic drone. It costs nothing on a fifths-tuned instrument.","tag":"harmony"},{"t":"Tremolo is a subdivision","b":"The mandolin cannot sustain, so a long note is many short ones. Start measured — four strokes a beat — and only after it is even let it blur into eight.","tag":"rhythm"},{"t":"Down on the beat","b":"Alternate picking puts every downstroke on a beat and every upstroke on an “and”, whatever course the note is on. The groove comes from never breaking that.","tag":"rhythm"},{"t":"Jigs reset every three","b":"In 6/8 the pattern is down-up-down, down-up-down. Two downs in a row at the join is not a mistake; it is what keeps the big beats heavy.","tag":"rhythm"},{"t":"Potatoes","b":"A fiddler counts the band in with four shuffle strokes on a root-and-fifth double stop — “ta-ters, ta-ters, ta-ters, ta-ters”. The mandolin plays the same kickoff.","tag":"rhythm"},{"t":"Monroe and the chop","b":"Bill Monroe built bluegrass around the mandolin: the chop as the band’s backbeat, the downstroke-heavy break, blues notes inside major keys. Most bluegrass mandolin descends from his 1940s records.","tag":"rhythm"},{"t":"The Celtic tremolo","b":"In Irish and Italian playing the tremolo is the voice, used on long notes and airs rather than as rhythm. The same strokes, a different job.","tag":"rhythm"},{"t":"Tab says where, the staff says when","b":"Four tab lines, the E course on top, numbers for frets. Tab has no rhythm of its own; read the note lengths from the staff above it.","tag":"reading"},{"t":"The open G is below the staff","b":"The mandolin reads the treble clef. The open G course sits two ledger lines under it; the open E course is the top space. The whole first position fits between.","tag":"reading"},{"t":"AABB","b":"Almost every fiddle tune is an 8-bar A part played twice and an 8-bar B part played twice. Learn the A part, and you already know a quarter of the tune.","tag":"reading"},{"t":"Reels, jigs, hornpipes","b":"A reel is 4/4 in straight eighths; a jig is 6/8 in two beats of three; a hornpipe is 4/4 played dotted. The time signature tells your pick hand which pattern to use.","tag":"reading"}]},"qualIv":{"":[0,4,7],"m":[0,3,7],"°":[0,3,6],"7":[0,4,7,10],"m7":[0,3,7,10],"maj7":[0,4,7,11],"m7♭5":[0,3,6,10],"sus2":[0,2,7],"sus4":[0,5,7],"add9":[0,2,4,7],"7♭9":[0,1,4,7,10],"6":[0,4,7,9],"m6":[0,3,7,9],"9":[0,2,4,7,10],"m9":[0,2,3,7,10],"5":[0,7]},"progs":[{"group":"Pop & Rock","num":"I–V–vi–IV","desc":"the four chords","minor":false,"toks":     for (let k = 0; k + 1 < pts.length; k++) { const [x1, y1] = pts[k], [x2, y2] = pts[k + 1], n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / 9));
      for (let t = 1; t < n; t++) ctx.fillRect(Math.round(x1 + (x2 - x1) * t / n) - 1, Math.round(y1 + (y2 - y1) * t / n) - 1, 2, 2); }
    // scenery in the margins, placed deterministically so every redraw matches
    pts.forEach(([x, y], k) => { const side = k % 2 ? 1 : -1, ox = Math.round(x + side * (36 + (k * 13) % 20)), oy = Math.round(y - 6 + (k * 7) % 10);
      if (ox < 5 || ox > W - 24 || oy < 4 || oy > H - 14) return;
      if (k % 5 === 2) drawRocks(ctx, ox, oy); else if (k % 5 === 0 || k % 5 === 3) drawBush(ctx, ox, oy); });
    if (W > 180) { drawWater(ctx, 6, Math.round(H * .18), 36, 17); drawWater(ctx, W - 48, Math.round(H * .57), 40, 19); drawBush(ctx, 10, Math.round(H * .8)); drawRocks(ctx, W - 30, Math.round(H * .08)); }
    // the castle waits beside the final node
    const last = pts[pts.length - 1];
    if (last) drawCastle(ctx, Math.round(last[0]) - 27, Math.round(last[1]) + 6, nodeSts[nodeSts.length - 1]);
  }, 40);
  setTimeout(() => { const pg = $('#page'); if (pg && wizHolder) { const r = wizHolder.getBoundingClientRect(), pr = pg.getBoundingClientRect(); pg.scrollTop += (r.top - pr.top) - pr.height * 0.4; } }, 60);
}

/* ================================================================ THE GAME LAYER — the guitar book's, carried over (by way of the Push book's split-file
   port) and dressed for Sun and Moon. A chapter on the road is a battle: two hearts; a wrong answer costs one, and losing
   both loses the chapter. Each right answer fills the chapter meter; fill it and the chapter is cleared. Points (◆) come
   from right answers, streaks and cleared chapters, and buy items: Hint and Heal. Reference is free — an open-book chart
   for the question, drawn from the same data the pages use. Turquoise (✦) comes from the recall bonus, as before.
   Also here: Learn mode vs Book mode, soft unlocks (Peek), the Index as a collection, and progress backup. */
const HEARTS = 2;   // lose both and the chapter is lost
const HINT_COST = 50, HEAL_COST = 150, PTS_RIGHT = 15, PTS_STREAK = 5, PTS_STREAK_MAX = 20, PTS_WIN = 60, PTS_FLAWLESS = 40, PTS_START = 100, PTS_TESTOUT = 150, PTS_BONUS = 25, PTS_READING = 60;

const bookMode = () => store.get('mode', 'learn') === 'book';
const setMode = m => { store.set('mode', m); redraw(); };

// a module's test-out: one long battle over every topic in it; win it and the whole module is cleared
function challengeOf(mi) {
  const M = MODULES[mi], topics = M.lessons.filter(l => l.topic && QBANK[l.topic]).map(l => l.topic);
  return {name: `${M.name} · Test out`, mod: mi, modName: M.name, acc: M.acc, challenge: true, topics};
}

/* ---------------- soft unlocks: a room opens when you clear the chapter that teaches it. Peek opens one for the session;
   Book mode opens everything. The key is page:item; the value is the chapter (its QBANK topic). */
const UNLOCKS = {
  'chords:closed': 'chop', 'chords:keys': 'chordsinkey',

  'lab:intervals': 'intervalshapes', 'lab:shape': 'ffcp',

const PEEK = new Set();
const lessonFor = key => LESSONS.find(l => chapKey(l) === UNLOCKS[key]);

const lockMark = key => isOpen(key) ? '' : '🔒 ';
function goLesson(L) { const s = state('course', {}); s.open = LESSONS.indexOf(L); s.challenge = -1; keep('course', s); page(PAGES.findIndex(p => p.id === 'learn')); }
// call where a sealed room would draw: draws the seal and returns true (the caller stops there)
function gate(v, key, label) {
  const L = lessonFor(key);
  if (!L || bookMode() || courseGot()[UNLOCKS[key]]) return false;
  if (PEEK.has(key)) { v.append(h('div', {class: 'peek-bar'}, h('span', {}, `Peeking at ${label} · clear “${L.name}” to open it for good`),
    h('button', {class: 'btn small', on: {click: () => goLesson(L)}}, 'Go to the chapter'))); return false; }
  v.append(h('div', {class: 'seal'},
    h('div', {class: 'seal-lock', 'aria-hidden': 'true'}, h('i'), h('i'), h('i'), h('i')),
